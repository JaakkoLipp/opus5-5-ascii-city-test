<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kanal-9 : a walkable ascii city</title>
<style>
  :root{
    --void:#000000;
    --phosphor:#bfe3da;
    --sodium:#ffb04a;
    --neon:#ff4fae;
    --ice:#5fe6ff;
    --dim:#5f7d77;
  }
  html,body{margin:0;height:100%;background:var(--void);overflow:hidden;}
  body{font-family:'DejaVu Sans Mono','Menlo','Consolas','Liberation Mono','Courier New',monospace;color:var(--phosphor);}
  canvas{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block;}
  #screen{cursor:crosshair;}
  #glow{pointer-events:none;mix-blend-mode:screen;opacity:.6;filter:blur(9px) brightness(1.7) saturate(1.3);}
  #fx{position:fixed;inset:0;pointer-events:none;
     background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.14) 3px),
                radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 60%,rgba(0,0,0,.55) 100%);}
  .hud{position:fixed;margin:0;pointer-events:none;white-space:pre;font-size:13px;line-height:1.4;}
  #hudTop{left:16px;top:12px;color:var(--sodium);text-shadow:0 0 8px rgba(255,160,60,.45);}
  #hudTop i{color:var(--phosphor);font-style:normal;}
  #hudKeys{left:16px;bottom:12px;color:var(--dim);}
  #hudKeys i{color:var(--phosphor);font-style:normal;}
  #hudMap{right:16px;top:12px;color:var(--dim);font-size:11px;line-height:1.08;border:1px solid rgba(95,230,255,.25);padding:6px 8px;background:rgba(0,4,6,.6);}
  #hudMap .p{color:var(--sodium);} #hudMap .c{color:var(--neon);} #hudMap .h{color:var(--ice);} #hudMap .b{color:#8fb3ac;}
  #cross{left:50%;top:50%;transform:translate(-50%,-50%);color:var(--phosphor);opacity:.5;font-size:14px;}
  #prompt{left:50%;top:calc(50% + 30px);transform:translateX(-50%);color:var(--ice);text-shadow:0 0 10px rgba(80,230,255,.7);font-size:15px;}
  #toast{left:50%;top:21%;transform:translateX(-50%);color:var(--sodium);font-size:14px;text-align:center;text-shadow:0 0 8px rgba(255,160,60,.5);}
  #dialog{position:fixed;left:50%;bottom:62px;transform:translateX(-50%);width:min(640px,86vw);display:none;
     border:1px solid rgba(255,79,174,.55);background:rgba(3,2,8,.84);padding:12px 16px;box-shadow:0 0 24px rgba(255,79,174,.18);}
  #dlgWho{color:var(--neon);font-size:13px;margin-bottom:6px;}
  #dlgText{margin:0;white-space:pre-wrap;font-size:15px;line-height:1.45;color:var(--phosphor);min-height:2.9em;}
  #dlgHint{color:var(--dim);font-size:12px;margin-top:8px;text-align:right;}
  #term{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(720px,90vw);height:min(400px,70vh);display:none;
     border:1px solid rgba(95,230,255,.5);background:rgba(0,6,5,.93);padding:16px 20px;box-shadow:0 0 40px rgba(60,255,200,.12);overflow:hidden;}
  #termText{margin:0;color:#7dffc8;white-space:pre-wrap;font-size:14px;line-height:1.5;text-shadow:0 0 6px rgba(80,255,190,.4);}
  #intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.58);cursor:pointer;}
  #introTitle{margin:0;color:var(--neon);font-size:clamp(7px,1.1vw,14px);line-height:1;text-shadow:0 0 14px rgba(255,79,174,.8);}
  #introText{margin:26px 0 0;color:var(--phosphor);font-size:14px;line-height:1.7;}
  #introText i{color:var(--sodium);font-style:normal;}
  #introText b{color:var(--ice);font-weight:normal;}
  .hidden{display:none !important;}
</style>

<body>
<canvas id="screen"></canvas>

<script>
'use strict';
(function () {

// =====================================================================
// 1. CONFIGURATION
// =====================================================================
const QS = new URLSearchParams(location.search);
const CFG = {
  seed: (parseInt(QS.get('seed') || '', 10) >>> 0) || 2077,
  fovX: 80 * Math.PI / 180,
  maxDist: 86,
  fogDist: 58,                  // squared exponential fog: exp(-(d / fogDist)^2)
  fog: [0.020, 0.017, 0.036],
  eyeHeight: 1.65,
  walkSpeed: 3.4,
  sprintSpeed: 7.4,
  accel: 10,
  mouseSens: 0.0022,
  radius: 0.3,
  rowPresets: [40, 52, 64, 78],
  quality: Math.min(3, Math.max(0, parseInt(QS.get('q') || '2', 10) || 0)),
  maxCellPx: 18,
  cellAspect: 0.6,
  ramp: ' .,:;+*ioxe%#&@',
  font: "'DejaVu Sans Mono','Menlo','Consolas','Liberation Mono','Courier New',monospace",
  exposure: 1.9,
  ink: [0.70, 0.88, 0.84],
  rainDrops: 520,
  startCredits: 60,
};

// =====================================================================
// 2. UTILITY FUNCTIONS
// =====================================================================
const PI = Math.PI, TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
let SALT = 0;
function ihash(x) {
  x |= 0;
  x = Math.imul(x ^ (x >>> 16), 0x7feb352d);
  x = Math.imul(x ^ (x >>> 15), 0x846ca68b);
  return (x ^ (x >>> 16)) >>> 0;
}
// deterministic hash of three integers, result in [0,1)
function hash3(a, b, c) {
  return ihash(Math.imul(a | 0, 0x27d4eb2d) ^ Math.imul(b | 0, 0x165667b1) ^ Math.imul(c | 0, 0x61c88647) ^ SALT) / 4294967296;
}
function angleTo(a, b, maxStep) {
  let d = b - a;
  while (d > PI) d -= TAU;
  while (d < -PI) d += TAU;
  if (d > maxStep) d = maxStep; else if (d < -maxStep) d = -maxStep;
  return a + d;
}

// 3x5 bitmap font used by neon signs and billboards (rows top to bottom, 3 bits each)
const FONT_SRC = {
  A: '010101111101101', B: '110101110101110', C: '011100100100011', D: '110101101101110',
  E: '111100110100111', F: '111100110100100', G: '011100101101011', H: '101101111101101',
  I: '111010010010111', J: '001001001101010', K: '101101110101101', L: '100100100100111',
  M: '101111111101101', N: '110101101101101', O: '010101101101010', P: '110101110100100',
  Q: '010101101110011', R: '110101110101101', S: '011100010001110', T: '111010010010010',
  U: '101101101101111', V: '101101101101010', W: '101101111111101', X: '101101010101101',
  Y: '101101010010010', Z: '111001010100111', 0: '111101101101111', 1: '010110010010111',
  2: '110001010100111', 3: '110001010001110', 4: '101101111001001', 5: '111100110001110',
  6: '011100111101111', 7: '111001010010010', 8: '111101111101111', 9: '111101111001110',
  '-': '000000111000000', '+': '000010111010000', '.': '000000000000010', '!': '010010010000010',
  ':': '000010000010000', '/': '001001010100100', ' ': '000000000000000',
};
const FONT = new Int32Array(128);
for (const k in FONT_SRC) FONT[k.charCodeAt(0)] = parseInt(FONT_SRC[k], 2);
function fontBit(code, row, col) { return (FONT[code & 127] >> (14 - (row * 3 + col))) & 1; }

// =====================================================================
// 3. SEEDED RANDOM GENERATION
// =====================================================================
class RNG {
  constructor(seed) { this.s = seed >>> 0; }
  next() {
    let t = (this.s = (this.s + 0x6D2B79F5) >>> 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  range(a, b) { return a + (b - a) * this.next(); }
  int(a, b) { return a + Math.floor(this.next() * (b - a + 1)); }
  chance(p) { return this.next() < p; }
  pick(arr) { return arr[Math.floor(this.next() * arr.length)]; }
}

// =====================================================================
// 4. WORLD REPRESENTATION
//    Static architecture: a 128 x 128 column grid, 64 levels of 1 m.
//    Each column keeps a 64-bit occupancy mask (two Int32 words) so a ray
//    can find the first solid level inside a column with bit operations.
//    Props, vehicles and people are analytic primitives (box, cylinder,
//    sphere) registered in per-tile linked lists.
// =====================================================================
const W = 128, D = 128, H = 64, WD = W * D;
const colLo = new Int32Array(WD), colHi = new Int32Array(WD);
const colTop = new Uint8Array(WD);
const vox = new Uint8Array(WD * H);          // voxel material, index c*H + z
const gmat = new Uint8Array(WD);             // ground material per tile
const bldOf = new Int16Array(WD);            // building id per tile (-1 none)
const tflag = new Uint8Array(WD);            // tile flags

const G_LOT = 0, G_ROAD = 1, G_WALK = 2, G_ALLEY = 3, G_FLOOR = 4, G_TUNNEL = 5;
const F_INDOOR = 1, F_NOWALK = 2, F_ALLEY = 4, F_PERIM = 8, F_CROSS = 16;
const V_BLDG = 1, V_WALLIN = 2, V_ROOFBOX = 3;

function setVox(x, y, z, m) {
  if (x < 0 || y < 0 || x >= W || y >= D || z < 0 || z >= H) return;
  const c = y * W + x;
  vox[c * H + z] = m;
  if (m) { if (z < 32) colLo[c] |= 1 << z; else colHi[c] |= 1 << (z - 32); }
  else { if (z < 32) colLo[c] &= ~(1 << z); else colHi[c] &= ~(1 << (z - 32)); }
}
function isSolidLevel(c, l) { return l < 32 ? (colLo[c] >>> l) & 1 : (colHi[c] >>> (l - 32)) & 1; }
function topOf(c) { const hi = colHi[c], lo = colLo[c]; return hi ? 64 - Math.clz32(hi) : (lo ? 32 - Math.clz32(lo) : 0); }
function fixTops() { for (let c = 0; c < WD; c++) colTop[c] = topOf(c); }
function rangeMask(a, b) { return (b >= 31 ? -1 : ((1 << (b + 1)) - 1)) & (-1 << a); }
// lowest solid level in [a,b] of column c, or -1
function firstUp(c, a, b) {
  if (a <= 31) { const m = colLo[c] & rangeMask(a, b < 31 ? b : 31); if (m) return 31 - Math.clz32(m & -m); }
  if (b >= 32) { const m = colHi[c] & rangeMask(a > 32 ? a - 32 : 0, b - 32); if (m) return 63 - Math.clz32(m & -m); }
  return -1;
}
// highest solid level in [b,a] of column c (scanning down from a), or -1
function firstDown(c, a, b) {
  if (a >= 32) { const m = colHi[c] & rangeMask(b > 32 ? b - 32 : 0, a - 32); if (m) return 63 - Math.clz32(m); }
  if (b <= 31) { const m = colLo[c] & rangeMask(b, a < 31 ? a : 31); if (m) return 31 - Math.clz32(m); }
  return -1;
}

// ---- primitives (struct of arrays) ----
const P_BOX = 0, P_CYL = 1, P_SPH = 2;
const PF_COLLIDE = 1;
const MAXP = 8192;
const pType = new Uint8Array(MAXP), pMat = new Uint8Array(MAXP), pFlag = new Uint8Array(MAXP);
const pX = new Float32Array(MAXP), pY = new Float32Array(MAXP), pZ = new Float32Array(MAXP);
const pHX = new Float32Array(MAXP), pHY = new Float32Array(MAXP), pHZ = new Float32Array(MAXP);
const pC = new Float32Array(MAXP), pS = new Float32Array(MAXP);
const pBot = new Float32Array(MAXP), pTop = new Float32Array(MAXP);
const pId = new Int32Array(MAXP), pGroup = new Int32Array(MAXP), pMail = new Int32Array(MAXP);
let nPrim = 0, nStatic = 0;

// box: half extents hx,hy,hz, yaw around z. cylinder: hx = radius, hz = half height. sphere: hx = radius.
function addPrim(type, x, y, z, hx, hy, hz, yaw, mat, id, flags, group) {
  if (nPrim >= MAXP) return -1;
  const p = nPrim++;
  pType[p] = type; pMat[p] = mat; pFlag[p] = flags || 0;
  pX[p] = x; pY[p] = y; pZ[p] = z;
  pHX[p] = hx; pHY[p] = type === P_BOX ? hy : hx; pHZ[p] = type === P_SPH ? hx : hz;
  pC[p] = Math.cos(yaw || 0); pS[p] = Math.sin(yaw || 0);
  pBot[p] = z - pHZ[p]; pTop[p] = z + pHZ[p];
  pId[p] = id || 0; pGroup[p] = group === undefined ? -1 : group;
  return p;
}

// per-tile linked lists: static lists are built once, dynamic lists every frame
const LMAX = 160000;
const lNext = new Int32Array(LMAX), lPrim = new Int32Array(LMAX);
const headS = new Int32Array(WD).fill(-1), headD = new Int32Array(WD).fill(-1);
const topS = new Float32Array(WD), topD = new Float32Array(WD);   // highest primitive top per tile
const CHN = (W >> 3) * (D >> 3);
const chunkTopS = new Float32Array(CHN), chunkTopD = new Float32Array(CHN);   // highest geometry per 8 x 8 chunk
let lCount = 0, lStatic = 0;
function registerPrim(p, head) {
  const tops = head === headS ? topS : topD, pt = pTop[p];
  let ex, ey;
  if (pType[p] === P_BOX) {
    const c = Math.abs(pC[p]), s = Math.abs(pS[p]);
    ex = c * pHX[p] + s * pHY[p]; ey = s * pHX[p] + c * pHY[p];
  } else { ex = ey = pHX[p]; }
  const x0 = Math.max(0, Math.floor(pX[p] - ex)), x1 = Math.min(W - 1, Math.floor(pX[p] + ex));
  const y0 = Math.max(0, Math.floor(pY[p] - ey)), y1 = Math.min(D - 1, Math.floor(pY[p] + ey));
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    if (lCount >= LMAX) return;
    const c = y * W + x;
    lPrim[lCount] = p; lNext[lCount] = head[c]; head[c] = lCount++;
    if (pt > tops[c]) tops[c] = pt;
    if (head === headD) { const k = (y >> 3) * (W >> 3) + (x >> 3); if (pt > chunkTopD[k]) chunkTopD[k] = pt; }
  }
}

// ---- point lights, bucketed per tile (1 m) ----
const MAXL = 1024;
const lX = new Float32Array(MAXL), lY = new Float32Array(MAXL), lZ = new Float32Array(MAXL);
const lRad = new Float32Array(MAXL), lR2 = new Float32Array(MAXL);
const lBr = new Float32Array(MAXL), lBg = new Float32Array(MAXL), lBb = new Float32Array(MAXL);
const lEr = new Float32Array(MAXL), lEg = new Float32Array(MAXL), lEb = new Float32Array(MAXL);
const lFlk = new Uint8Array(MAXL), lIn = new Uint8Array(MAXL), lPh = new Float32Array(MAXL);
let nLight = 0, nLightS = 0;
const cHeadS = new Int32Array(WD).fill(-1), cHeadD = new Int32Array(WD).fill(-1);
const CMAX = 400000;
const cNext = new Int32Array(CMAX), cLight = new Int32Array(CMAX);
let cCount = 0, cStatic = 0;
// flicker modes: 0 steady, 1 buzzing tube, 2 slow pulse, 3 follows sign, 4 follows billboard, 5 traffic signal
function addLight(x, y, z, rad, r, g, b, flk, indoor) {
  if (nLight >= MAXL) return -1;
  const L = nLight++;
  lX[L] = x; lY[L] = y; lZ[L] = z; lRad[L] = rad; lR2[L] = rad * rad;
  lBr[L] = r; lBg[L] = g; lBb[L] = b; lEr[L] = r; lEg[L] = g; lEb[L] = b;
  lFlk[L] = flk || 0; lIn[L] = indoor ? 1 : 0; lPh[L] = 0;
  return L;
}
// a light is listed in every tile whose footprint lies inside its radius
function registerLight(L, head) {
  const r = lRad[L], x = lX[L], y = lY[L], r2 = r * r;
  const x0 = Math.max(0, Math.floor(x - r)), x1 = Math.min(W - 1, Math.floor(x + r));
  const y0 = Math.max(0, Math.floor(y - r)), y1 = Math.min(D - 1, Math.floor(y + r));
  for (let ty = y0; ty <= y1; ty++) {
    const dy = y < ty ? ty - y : y > ty + 1 ? y - ty - 1 : 0;
    for (let tx = x0; tx <= x1; tx++) {
      const dx = x < tx ? tx - x : x > tx + 1 ? x - tx - 1 : 0;
      if (dx * dx + dy * dy >= r2) continue;
      if (cCount >= CMAX) return;
      const k = ty * W + tx;
      cLight[cCount] = L; cNext[cCount] = head[k]; head[k] = cCount++;
    }
  }
}

// ---- materials for primitives ----
const MA = new Float32Array(64 * 3), MS = new Float32Array(64);
const MT = {};
let MID = 1;
function defMat(name, r, g, b, spec) { const id = MID++; MT[name] = id; MA[id * 3] = r; MA[id * 3 + 1] = g; MA[id * 3 + 2] = b; MS[id] = spec || 0; }
defMat('POLE', 0.30, 0.32, 0.34, 0.3); defMat('LAMP', 0.30, 0.30, 0.30, 0.2); defMat('SIGN', 0.08, 0.08, 0.09, 0.4);
defMat('BILL', 0.06, 0.06, 0.07, 0.3); defMat('CAR', 0.4, 0.4, 0.4, 0.6); defMat('CARGLASS', 0.03, 0.04, 0.06, 1.0);
defMat('CHASSIS', 0.04, 0.04, 0.04, 0); defMat('PEDBODY', 0.2, 0.2, 0.2, 0.1); defMat('PEDHEAD', 0.5, 0.4, 0.35, 0.1);
defMat('PEDLEG', 0.06, 0.06, 0.07, 0); defMat('UMB', 0.05, 0.05, 0.06, 0.5); defMat('LEDSTICK', 0.2, 0.2, 0.2, 0);
defMat('TRUNK', 0.22, 0.17, 0.13, 0); defMat('CANOPY', 0.1, 0.28, 0.14, 0); defMat('PLANTER', 0.30, 0.30, 0.32, 0.1);
defMat('TLIGHT', 0.08, 0.08, 0.08, 0.2); defMat('PEDSIG', 0.08, 0.08, 0.08, 0.2); defMat('DOOR', 0.28, 0.30, 0.33, 0.5);
defMat('COUNTER', 0.32, 0.18, 0.12, 0.3); defMat('SHELF', 0.10, 0.10, 0.11, 0); defMat('SCREEN', 0.05, 0.05, 0.05, 0.3);
defMat('DESK', 0.15, 0.15, 0.17, 0.2); defMat('RACK', 0.05, 0.05, 0.06, 0.2); defMat('CEIL', 0.3, 0.3, 0.3, 0);
defMat('STOOL', 0.45, 0.12, 0.12, 0.3); defMat('VEND', 0.25, 0.25, 0.30, 0.4); defMat('BIN', 0.18, 0.20, 0.20, 0.1);
defMat('DUMP', 0.12, 0.20, 0.15, 0.2); defMat('CRATE', 0.36, 0.27, 0.16, 0); defMat('BENCH', 0.30, 0.22, 0.15, 0.1);
defMat('HYDRANT', 0.50, 0.10, 0.08, 0.3); defMat('AWNING', 0.3, 0.3, 0.3, 0); defMat('TANK', 0.25, 0.24, 0.22, 0.1);
defMat('ANTENNA', 0.30, 0.30, 0.30, 0.2); defMat('NEON', 0.2, 0.2, 0.2, 0); defMat('LANTERN', 0.4, 0.1, 0.05, 0);
defMat('KIOSK', 0.12, 0.13, 0.15, 0.3); defMat('FRIDGE', 0.20, 0.22, 0.25, 0.3); defMat('POT', 0.30, 0.20, 0.14, 0);
defMat('KEEPER', 0.45, 0.42, 0.38, 0); defMat('BOLLARD', 0.50, 0.42, 0.08, 0.2); defMat('TABLE', 0.25, 0.20, 0.18, 0.4);
defMat('PLANT', 0.10, 0.30, 0.12, 0); defMat('BAG', 0.05, 0.05, 0.06, 0.6); defMat('WALLLAMP', 0.2, 0.2, 0.2, 0);

// shared palettes
const NEON = [[1.0, 0.16, 0.70], [0.12, 0.82, 1.0], [1.0, 0.55, 0.10], [0.60, 0.28, 1.0], [1.0, 0.20, 0.26], [0.40, 1.0, 0.55]];
const WINPAL = [
  [[1.0, 0.72, 0.38], [1.0, 0.84, 0.55], [0.55, 0.72, 1.0], [1.0, 0.62, 0.32]],
  [[0.60, 0.85, 1.0], [0.85, 0.95, 1.0], [0.42, 0.62, 1.0], [0.9, 0.9, 0.8]],
  [[0.75, 1.0, 0.80], [0.90, 1.0, 0.90], [1.0, 0.80, 0.50], [0.7, 0.95, 0.85]],
  [[1.0, 0.35, 0.75], [0.35, 0.90, 1.0], [1.0, 0.75, 0.40], [0.7, 0.5, 1.0]],
];
const TLC = [[1.0, 0.12, 0.08], [1.0, 0.62, 0.06], [0.20, 1.0, 0.45]];
const CAR_COLS = [[0.50, 0.10, 0.12], [0.10, 0.15, 0.35], [0.55, 0.55, 0.58], [0.08, 0.08, 0.09], [0.60, 0.45, 0.10], [0.15, 0.35, 0.30], [0.35, 0.12, 0.40], [0.42, 0.44, 0.46]];

// =====================================================================
// 5. PROCEDURAL CITY GENERATION
//    Layout: one north-south avenue crossing one east-west street,
//    four blocks with alleys, a ring of perimeter megastructures with
//    road tunnels, and one hand-placed enterable noodle bar.
// =====================================================================
const AV0 = 58, AV1 = 70, ST0 = 58, ST1 = 68, PERIM = 6;
const BLOCKS = [
  { x0: 6, y0: 6, x1: 54, y1: 54, av: 'E', st: 'N', name: 'rust yards' },
  { x0: 74, y0: 6, x1: 122, y1: 54, av: 'W', st: 'N', name: 'neon market' },
  { x0: 6, y0: 72, x1: 54, y1: 122, av: 'E', st: 'S', name: 'kowloon stacks' },
  { x0: 74, y0: 72, x1: 122, y1: 122, av: 'W', st: 'S', name: 'chrome heights' },
];
const SHOP = { x0: 74, y0: 72, x1: 88, y1: 86 };
const ST_GLASS = 0, ST_CONCRETE = 1, ST_BRICK = 2, ST_IND = 3, ST_MEGA = 4;
const WORDS = ['RAMEN', 'SUSHI', 'BAR', 'HOTEL', 'NOODLE', 'CLUB', 'DATA', 'CYBER', 'KARAOKE', 'ARCADE', 'LOVE', 'NEON',
  'OPEN', '24H', 'TATTOO', 'PAWN', 'CHROME', 'DELI', 'ROBOT', 'NET', 'VIDEO', 'TAXI', 'DOJO', 'DINER', 'SAKE', 'MOTEL',
  'REPAIR', 'IMPLANT', 'CLINIC', 'GYM', 'TEA', 'PHO', 'UDON', 'ZEN', 'VOID', 'GRID', 'SYNTH', 'NOIR', 'SOBA', 'LIQUOR', 'MEDS', 'BOOKS'];
const BILLWORDS = ['BUY MORE SLEEP LESS', 'KANAL TELECOM', 'DREAM IN CHROME', 'SYNTH-COLA ZERO', 'NEW YOU CLINIC',
  'OBEY THE GRID', 'TIGER BALM 2', 'NIGHT NEVER ENDS'];

const buildings = [], signs = [], bills = [], interactables = [];
const alleyMouths = [], alleyRuns = [], parkedCols = [];
const SKY_BINS = 256;
const skyH = new Float32Array(SKY_BINS), skyBeacon = new Uint8Array(SKY_BINS);
let worldTop = 64;
const spawn = { x: 72, y: 12, yaw: PI / 2 };

function generateCity(seed) {
  SALT = ihash(seed ^ 0x5bd1e995);
  const R = new RNG(seed);
  colLo.fill(0); colHi.fill(0); colTop.fill(0); vox.fill(0); gmat.fill(0); tflag.fill(0); bldOf.fill(-1);
  headS.fill(-1); headD.fill(-1); cHeadS.fill(-1); cHeadD.fill(-1); topS.fill(0); topD.fill(0);
  nPrim = 0; nLight = 0; lCount = 0; cCount = 0;
  buildings.length = 0; signs.length = 0; bills.length = 0; interactables.length = 0;
  alleyMouths.length = 0; alleyRuns.length = 0; parkedCols.length = 0;

  layoutGround();
  buildPerimeter(R);
  for (const B of BLOCKS) buildBlock(B, R);
  buildShop(R);
  decorateBuildings(R);
  placeStreetProps(R);
  placeTraffic();
  placeParkedCars(R);
  decorateAlleys(R);
  makeSkyline(R);

  fixTops();
  nStatic = nPrim;
  for (let p = 0; p < nStatic; p++) registerPrim(p, headS);
  lStatic = lCount;
  nLightS = nLight;
  for (let L = 0; L < nLightS; L++) registerLight(L, cHeadS);
  cStatic = cCount;
  worldTop = 0;
  for (let c = 0; c < WD; c++) if (colTop[c] > worldTop) worldTop = colTop[c];
  for (let p = 0; p < nStatic; p++) if (pTop[p] > worldTop) worldTop = pTop[p];
  worldTop += 0.5;
  chunkTopS.fill(0);
  for (let y = 0; y < D; y++) for (let x = 0; x < W; x++) {
    const c = y * W + x, k = (y >> 3) * (W >> 3) + (x >> 3);
    const t = Math.max(colTop[c], topS[c]);
    if (t > chunkTopS[k]) chunkTopS[k] = t;
  }
}

function layoutGround() {
  for (let y = 0; y < D; y++) for (let x = 0; x < W; x++) {
    const c = y * W + x;
    const onAv = x >= AV0 && x < AV1, onSt = y >= ST0 && y < ST1;
    const wAv = (x >= 54 && x < 58) || (x >= 70 && x < 74);
    const wSt = (y >= 54 && y < 58) || (y >= 68 && y < 72);
    let g = G_LOT, f = 0;
    if (onAv || onSt) { g = G_ROAD; if (wAv || wSt) f |= F_CROSS; }
    else if (wAv || wSt) g = G_WALK;
    if (x < PERIM || y < PERIM || x >= W - PERIM || y >= D - PERIM) { f |= F_PERIM | F_NOWALK; if (g === G_ROAD) g = G_TUNNEL; }
    gmat[c] = g; tflag[c] = f;
  }
}

function styleParams(b, R) {
  const P = [
    { floorH: 4, pitch: 1.6, winW: 1.3, wz0: 0.35, wz1: 3.65, lit: 0.30, pal: 1, t: [0.50, 0.62, 0.72] },
    { floorH: 3, pitch: R.pick([2.5, 3, 3.5]), winW: 1.4, wz0: 0.9, wz1: 2.3, lit: 0.42, pal: 0, t: [0.58, 0.58, 0.60] },
    { floorH: 3, pitch: 2, winW: 1.0, wz0: 0.8, wz1: 2.4, lit: 0.45, pal: 0, t: [0.62, 0.48, 0.42] },
    { floorH: 4, pitch: 4, winW: 3.6, wz0: 2.3, wz1: 3.2, lit: 0.30, pal: 2, t: [0.48, 0.54, 0.50] },
    { floorH: 3, pitch: 1.25, winW: 0.75, wz0: 0.8, wz1: 2.2, lit: 0.22, pal: 3, t: [0.45, 0.47, 0.55] },
  ][b.style];
  b.floorH = P.floorH; b.pitch = P.pitch; b.winW = P.winW; b.wz0 = P.wz0; b.wz1 = P.wz1; b.lit = P.lit + R.range(-0.08, 0.08);
  b.pal = R.chance(0.2) ? R.int(0, 3) : P.pal;
  const j = R.range(-0.06, 0.06);
  b.tr = P.t[0] + j + R.range(-0.03, 0.03); b.tg = P.t[1] + j; b.tb = P.t[2] + j + R.range(-0.03, 0.03);
}

// which sides of a footprint face open ground (sidewalk, road or alley)
function buildingSides(b) {
  const out = [];
  const mx = Math.floor((b.x0 + b.x1) / 2), my = Math.floor((b.y0 + b.y1) / 2);
  const test = (x, y) => (x < 0 || y < 0 || x >= W || y >= D) ? -1 : (bldOf[y * W + x] >= 0 ? -1 : gmat[y * W + x]);
  out.push({ side: 'W', nx: -1, ny: 0, plane: b.x0, a0: b.y0, a1: b.y1, g: test(b.x0 - 1, my) });
  out.push({ side: 'E', nx: 1, ny: 0, plane: b.x1, a0: b.y0, a1: b.y1, g: test(b.x1, my) });
  out.push({ side: 'S', nx: 0, ny: -1, plane: b.y0, a0: b.x0, a1: b.x1, g: test(mx, b.y0 - 1) });
  out.push({ side: 'N', nx: 0, ny: 1, plane: b.y1, a0: b.x0, a1: b.x1, g: test(mx, b.y1) });
  return out;
}

function carveRing(x0, y0, x1, y1, sb, zs, h) {
  for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
    const e = Math.min(x - x0, x1 - 1 - x, y - y0, y1 - 1 - y);
    if (e < sb) for (let z = zs; z < h; z++) setVox(x, y, z, 0);
  }
}

function makeBuilding(x0, y0, x1, y1, R, opt) {
  const w = x1 - x0, d = y1 - y0;
  const b = { id: buildings.length, x0, y0, x1, y1, style: opt.style, h: Math.min(H - 4, opt.h), shop: !!opt.shop, perim: !!opt.perim, arcade: '', setback: false };
  styleParams(b, R);
  buildings.push(b);
  const h = b.h;
  for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
    bldOf[y * W + x] = b.id;
    for (let z = 0; z < h; z++) setVox(x, y, z, V_BLDG);
  }
  if (opt.plain) return b;
  // stepped setbacks
  if (h >= 14 && w >= 8 && d >= 8 && R.chance(0.55)) {
    const sb = R.int(1, Math.min(3, Math.floor(Math.min(w, d) / 4)));
    const zs = R.int(Math.floor(h * 0.4), Math.floor(h * 0.75));
    carveRing(x0, y0, x1, y1, sb, zs, h);
    b.setback = true;
    if (h >= 28 && R.chance(0.5) && Math.min(w, d) - 2 * sb >= 7) {
      const sb2 = sb + R.int(1, 2), zs2 = R.int(zs + 3, h - 3);
      carveRing(x0, y0, x1, y1, sb2, zs2, h);
    }
  } else if (w >= 4 && d >= 4) {
    // parapet ring around a flat roof
    for (let y = y0 + 1; y < y1 - 1; y++) for (let x = x0 + 1; x < x1 - 1; x++) setVox(x, y, h - 1, 0);
  }
  // arcade: recessed ground floor with pillars along a sidewalk
  if (!b.perim && b.style !== ST_GLASS && R.chance(0.3)) {
    const sd = buildingSides(b).filter(s => s.g === G_WALK);
    if (sd.length) {
      const s = sd[0];
      b.arcade = s.side;
      const len = s.a1 - s.a0;
      for (let k = 0; k < len; k++) {
        if (k === 0 || k === len - 1 || k % 4 === 0) continue;
        const x = s.nx !== 0 ? (s.nx < 0 ? x0 : x1 - 1) : s.a0 + k;
        const y = s.nx !== 0 ? s.a0 + k : (s.ny < 0 ? y0 : y1 - 1);
        for (let z = 0; z < 3; z++) setVox(x, y, z, 0);
        gmat[y * W + x] = G_WALK;
      }
    }
  }
  // rooftop machinery (voxel boxes)
  if (w >= 5 && d >= 5) {
    const n = R.int(0, 3);
    for (let i = 0; i < n; i++) {
      const sx = R.int(1, 2), sy = R.int(1, 2), hh = R.int(1, 2);
      const x = R.int(x0 + 1, x1 - 1 - sx), y = R.int(y0 + 1, y1 - 1 - sy);
      const top = topOf(y * W + x);
      if (top < 4 || top + hh >= H) continue;
      for (let yy = y; yy < y + sy; yy++) for (let xx = x; xx < x + sx; xx++) for (let z = top; z < top + hh; z++) setVox(xx, yy, z, V_ROOFBOX);
    }
  }
  return b;
}

function pickStyleHeight(R, x0, y0, x1, y1) {
  const w = x1 - x0, d = y1 - y0, area = w * d;
  const near = Math.max(0, 1 - Math.hypot((x0 + x1) / 2 - 64, (y0 + y1) / 2 - 63) / 70);
  const r = R.next();
  let style;
  if (area < 45) style = r < 0.6 ? ST_BRICK : ST_IND;
  else if (r < 0.25) style = ST_GLASS; else if (r < 0.5) style = ST_CONCRETE;
  else if (r < 0.7) style = ST_BRICK; else if (r < 0.85) style = ST_MEGA; else style = ST_IND;
  let h;
  switch (style) {
    case ST_GLASS: h = R.int(22, 42) + near * 14; break;
    case ST_CONCRETE: h = R.int(12, 30); break;
    case ST_BRICK: h = R.int(7, 16); break;
    case ST_IND: h = R.int(6, 12); break;
    default: h = R.int(26, 48);
  }
  if (Math.min(w, d) < 5) h = Math.min(h, 14);
  return { style, h: Math.round(h) };
}

function splitLots(x0, y0, x1, y1, R, out) {
  const w = x1 - x0, d = y1 - y0;
  if (w <= 0 || d <= 0) return;
  const big = w > 18 || d > 18;
  if (!big && (w < 11 || d < 11 || R.chance(0.35))) { out.push([x0, y0, x1, y1]); return; }
  if (w >= d && w >= 10) { const s = x0 + R.int(5, w - 5); splitLots(x0, y0, s, y1, R, out); splitLots(s, y0, x1, y1, R, out); }
  else if (d >= 10) { const s = y0 + R.int(5, d - 5); splitLots(x0, y0, x1, s, R, out); splitLots(x0, s, x1, y1, R, out); }
  else out.push([x0, y0, x1, y1]);
}

function carveAlley(x0, y0, x1, y1) {
  for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
    const c = y * W + x;
    gmat[c] = G_ALLEY; tflag[c] |= F_ALLEY;
  }
}

function buildPerimeter(R) {
  const strips = [
    { horiz: true, a0: 0, a1: W, b0: 0, b1: PERIM, gate: [54, 74], n: [0, 1] },
    { horiz: true, a0: 0, a1: W, b0: D - PERIM, b1: D, gate: [54, 74], n: [0, -1] },
    { horiz: false, a0: PERIM, a1: D - PERIM, b0: 0, b1: PERIM, gate: [54, 72], n: [1, 0] },
    { horiz: false, a0: PERIM, a1: D - PERIM, b0: W - PERIM, b1: W, gate: [54, 72], n: [-1, 0] },
  ];
  for (const s of strips) {
    const cuts = [s.a0];
    let a = s.a0;
    while (a < s.gate[0]) { a += R.int(9, 18); if (a > s.gate[0] - 5) a = s.gate[0]; cuts.push(a); }
    a = s.gate[1]; cuts.push(a);
    while (a < s.a1) { a += R.int(9, 18); if (a > s.a1 - 5) a = s.a1; cuts.push(a); }
    for (let i = 0; i < cuts.length - 1; i++) {
      const c0 = cuts[i], c1 = cuts[i + 1];
      const gate = c0 === s.gate[0];
      const rect = s.horiz ? [c0, s.b0, c1, s.b1] : [s.b0, c0, s.b1, c1];
      const h = gate ? R.int(30, 38) : (R.chance(0.22) ? R.int(10, 16) : R.int(24, 50));
      const style = gate ? ST_MEGA : R.pick([ST_GLASS, ST_MEGA, ST_MEGA, ST_CONCRETE]);
      const b = makeBuilding(rect[0], rect[1], rect[2], rect[3], R, { style, h, perim: true });
      if (gate) {
        // road tunnel through the gate megastructure
        for (let y = rect[1]; y < rect[3]; y++) for (let x = rect[0]; x < rect[2]; x++) {
          if (gmat[y * W + x] !== G_TUNNEL) continue;
          for (let z = 0; z < 7; z++) setVox(x, y, z, 0);
        }
        // tunnel ceiling lights near the mouth
        const along = s.horiz;
        const cx = along ? 64 : (s.n[0] > 0 ? 3 : W - 3), cy = along ? (s.n[1] > 0 ? 3 : D - 3) : 63;
        addLight(cx, cy, 6.2, 9, 1.4, 0.7, 0.25, 0, 0);
        // inward facing billboard above the tunnel mouth
        const plane = s.horiz ? (s.n[1] > 0 ? s.b1 : s.b0) : (s.n[0] > 0 ? s.b1 : s.b0);
        const hx = 5.5, hz = 3.2, zc = 12.5;
        const px = s.horiz ? 64 : plane + s.n[0] * 0.2, py = s.horiz ? plane + s.n[1] * 0.2 : 63;
        addBillboard(px, py, zc, hx, hz, s.n[0], s.n[1], R);
      }
      b.gate = gate;
    }
  }
}

function buildBlock(B, R) {
  const offY = R.int(16, 27), offX = R.int(16, 27);
  const ay = B.st === 'N' ? B.y1 - offY - 3 : B.y0 + offY;
  const ax = B.av === 'E' ? B.x1 - offX - 3 : B.x0 + offX;
  const tee = R.chance(0.5);
  carveAlley(B.x0, ay, B.x1, ay + 3);
  alleyRuns.push({ axis: 'x', a0: B.x0, a1: B.x1, c0: ay, cross: ax, block: B });
  let ys0, ys1;
  if (B.st === 'N') { ys1 = B.y1; ys0 = tee ? ay + 3 : B.y0; } else { ys0 = B.y0; ys1 = tee ? ay : B.y1; }
  carveAlley(ax, ys0, ax + 3, ys1);
  alleyRuns.push({ axis: 'y', a0: ys0, a1: ys1, c0: ax, cross: ay, block: B });
  const avEdge = B.av === 'E' ? B.x1 : B.x0, inX = B.av === 'E' ? -1 : 1;
  const stEdge = B.st === 'N' ? B.y1 : B.y0, inY = B.st === 'N' ? -1 : 1;
  alleyMouths.push({ x: B.av === 'E' ? 56 : 72, y: ay + 1.5, pts: [[avEdge + inX * 4, ay + 1.5], [avEdge + inX * 13, ay + 1.5]] });
  alleyMouths.push({ x: ax + 1.5, y: B.st === 'N' ? 56 : 70, pts: [[ax + 1.5, stEdge + inY * 4], [ax + 1.5, stEdge + inY * 13]] });

  const near = B.st === 'N' ? [ay + 3, B.y1] : [B.y0, ay];
  const far = B.st === 'N' ? [B.y0, ay] : [ay + 3, B.y1];
  const rects = [[B.x0, near[0], ax, near[1]], [ax + 3, near[0], B.x1, near[1]]];
  if (tee) rects.push([B.x0, far[0], B.x1, far[1]]);
  else rects.push([B.x0, far[0], ax, far[1]], [ax + 3, far[0], B.x1, far[1]]);
  const lots = [];
  for (const r of rects) {
    if (r[0] <= SHOP.x0 && r[1] <= SHOP.y0 && r[2] >= SHOP.x1 && r[3] >= SHOP.y1) {
      // keep the noodle bar lot free, split the L-shaped rest
      splitLots(SHOP.x1, r[1], r[2], r[3], R, lots);
      splitLots(r[0], SHOP.y1, SHOP.x1, r[3], R, lots);
    } else splitLots(r[0], r[1], r[2], r[3], R, lots);
  }
  for (const L of lots) {
    const sh = pickStyleHeight(R, L[0], L[1], L[2], L[3]);
    makeBuilding(L[0], L[1], L[2], L[3], R, sh);
  }
}

// ---------- signs and billboards ----------
function addSign(text, vertical, R) {
  const k = R.int(0, NEON.length - 1);
  const s = { idx: signs.length, text, vertical, col: NEON[k], c2: NEON[(k + R.int(1, 4)) % NEON.length], mode: R.int(0, 3),
    ph: R.range(0, 10), lvl: 1, seq: 99, dead: -1, deadLetter: R.chance(0.35) ? R.int(0, text.length - 1) : -1 };
  signs.push(s);
  return s.idx;
}
function facadeSolid(sd, t, z) {
  const zi = Math.floor(z);
  if (zi < 0 || zi >= H) return false;
  const x = sd.nx !== 0 ? (sd.nx < 0 ? sd.plane : sd.plane - 1) : Math.floor(t);
  const y = sd.nx !== 0 ? Math.floor(t) : (sd.ny < 0 ? sd.plane : sd.plane - 1);
  if (x < 0 || y < 0 || x >= W || y >= D) return false;
  return isSolidLevel(y * W + x, zi) === 1;
}
function addBladeSign(b, sd, t, R, word, colIdx) {
  word = word || R.pick(WORDS);
  const n = word.length;
  const cell = Math.min(0.2, 6.2 / (n * 6 + 1));
  const hz = (n * 6 + 1) * cell / 2, hx = 2.5 * cell;
  const zc = 3.8 + hz + R.range(0, 1.2);
  if (!facadeSolid(sd, t, zc + hz) || !facadeSolid(sd, t, zc - hz)) return false;
  const px = sd.nx !== 0 ? sd.plane + sd.nx * hx : t;
  const py = sd.nx !== 0 ? t : sd.plane + sd.ny * hx;
  const si = addSign(word, true, R);
  if (colIdx !== undefined) signs[si].col = NEON[colIdx];
  addPrim(P_BOX, px, py, zc, hx, 0.08, hz, Math.atan2(sd.ny, sd.nx), MT.SIGN, si, 0);
  const c = signs[si].col;
  const L = addLight(px + sd.nx * 0.5, py + sd.ny * 0.5, zc - hz * 0.4, 9, c[0] * 1.4, c[1] * 1.4, c[2] * 1.4, 3, 0);
  lPh[L] = si;
  return true;
}
function addShopSign(b, sd, t, R, word, zc, colIdx) {
  word = word || R.pick(WORDS);
  const n = word.length, cell = 0.13;
  const hx = (n * 4 + 1) * cell / 2, hz = 3.5 * cell;
  if (2 * hx > sd.a1 - sd.a0 - 1) return false;
  t = clamp(t, sd.a0 + hx + 0.4, sd.a1 - hx - 0.4);
  zc = zc || (b.arcade === sd.side ? 3.55 : 3.1);
  if (!facadeSolid(sd, t, zc)) return false;
  const px = sd.nx !== 0 ? sd.plane + sd.nx * 0.12 : t;
  const py = sd.nx !== 0 ? t : sd.plane + sd.ny * 0.12;
  const si = addSign(word, false, R);
  if (colIdx !== undefined) signs[si].col = NEON[colIdx];
  addPrim(P_BOX, px, py, zc, hx, 0.1, hz, Math.atan2(-sd.nx, sd.ny), MT.SIGN, si, 0);
  const c = signs[si].col;
  const L = addLight(px + sd.nx * 0.9, py + sd.ny * 0.9, zc - 0.5, 7.5, c[0] * 1.3, c[1] * 1.3, c[2] * 1.3, 3, 0);
  lPh[L] = si;
  return true;
}
function addBillboard(px, py, zc, hx, hz, nx, ny, R) {
  const k = R.int(0, NEON.length - 1);
  const B = { idx: bills.length, text: R.pick(BILLWORDS), mode: R.int(0, 2), c1: NEON[k], c2: NEON[(k + R.int(1, 5)) % NEON.length],
    cell: 2 * hz / 9, ph: R.range(0, 10), lvl: 1 };
  bills.push(B);
  addPrim(P_BOX, px, py, zc, hx, 0.15, hz, Math.atan2(-nx, ny), MT.BILL, B.idx, 0);
  const L = addLight(px + nx * 3.5, py + ny * 3.5, zc, 18, B.c1[0] * 1.7, B.c1[1] * 1.7, B.c1[2] * 1.7, 4, 0);
  lPh[L] = B.idx;
}

function decorateBuildings(R) {
  for (const b of buildings) {
    if (b.shop) continue;
    const sides = buildingSides(b);
    // rooftop props
    const cx = Math.floor((b.x0 + b.x1) / 2), cy = Math.floor((b.y0 + b.y1) / 2);
    const top = topOf(cy * W + cx);
    if ((b.style === ST_CONCRETE || b.style === ST_BRICK) && R.chance(0.4) && b.x1 - b.x0 >= 6 && b.y1 - b.y0 >= 6) {
      const tx = b.x0 + 2.5, ty = b.y0 + 2.5, tt = topOf(Math.floor(ty) * W + Math.floor(tx));
      addPrim(P_CYL, tx, ty, tt + 1.4, 1.0, 0, 1.1, 0, MT.TANK, 0, 0);
    }
    if ((b.style === ST_GLASS || b.style === ST_MEGA) && b.h >= 24 && R.chance(0.6)) {
      const ah = R.range(3, 8);
      addPrim(P_BOX, cx + 0.5, cy + 0.5, top + ah / 2, 0.07, 0.07, ah / 2, 0, MT.ANTENNA, R.int(0, 100), 0);
    }
    if (b.perim) continue;
    for (const sd of sides) {
      if (sd.g !== G_WALK) continue;
      const len = sd.a1 - sd.a0;
      let used = -99;
      if (R.chance(0.65) && len >= 4) {
        const t = R.range(sd.a0 + 1.2, sd.a1 - 1.2);

      }
      if (R.chance(0.5)) {

        if (Math.abs(t - used) < 3.5) t = used + (t < used ? -3.5 : 3.5);
        addShopSign(b, sd, t, R);
      }
      if (b.arcade !== sd.side && R.chance(0.3) && len >= 5) {
        const hx = R.range(1.3, 2.2), t = clamp(R.range(sd.a0 + 2, sd.a1 - 2), sd.a0 + hx + 0.3, sd.a1 - hx - 0.3);
        if (Math.abs(t - used) > 1.2) {
          const px = sd.nx !== 0 ? sd.plane + sd.nx * 0.7 : t, py = sd.nx !== 0 ? t : sd.plane + sd.ny * 0.7;
          const ci = R.int(0, NEON.length - 1);
          addPrim(P_BOX, px, py, 2.55, hx, 0.7, 0.05, Math.atan2(-sd.nx, sd.ny), MT.AWNING, ci, 0);
          const c = NEON[ci];
          addLight(px + sd.nx * 0.3, py + sd.ny * 0.3, 2.3, 5.5, 0.5 + c[0] * 0.5, 0.35 + c[1] * 0.4, 0.25 + c[2] * 0.4, 0, 0);
        }
      }
      if (b.h >= 22 && b.style !== ST_BRICK && R.chance(0.35) && bills.length < 12 && len >= 9) {
        const hx = R.range(3, Math.min(4.5, len / 2 - 1)), hz = R.range(2.2, 3.2);
        const zc = R.range(9 + hz, Math.max(9 + hz, Math.min(b.h - hz - 2, 26)));
        const t = R.range(sd.a0 + hx + 0.5, sd.a1 - hx - 0.5);
        if (facadeSolid(sd, t, zc + hz) && facadeSolid(sd, t - hx + 0.3, zc) && facadeSolid(sd, t + hx - 0.3, zc)) {
          const px = sd.nx !== 0 ? sd.plane + sd.nx * 0.16 : t, py = sd.nx !== 0 ? t : sd.plane + sd.ny * 0.16;
          addBillboard(px, py, zc, hx, hz, sd.nx, sd.ny, R);
        }
      }
    }
    // neon tube on a street corner of tall towers
    if ((b.style === ST_GLASS || b.style === ST_MEGA) && R.chance(0.4)) {
      const street = sides.filter(s => s.g === G_WALK);
      if (street.length) {
        const s = street[0];
        const corner = s.nx !== 0 ? [s.plane, R.chance(0.5) ? b.y0 : b.y1] : [R.chance(0.5) ? b.x0 : b.x1, s.plane];
        const tx = Math.min(W - 1, Math.max(0, corner[0] - (corner[0] === b.x1 ? 1 : 0)));
        const ty = Math.min(D - 1, Math.max(0, corner[1] - (corner[1] === b.y1 ? 1 : 0)));
        const ct = topOf(ty * W + tx);
        if (ct > 10) {
          const ox = corner[0] === b.x1 ? 0.06 : -0.06, oy = corner[1] === b.y1 ? 0.06 : -0.06;
          const ci = R.int(0, NEON.length - 1), hz = (ct * 0.93 - 4) / 2;
          addPrim(P_BOX, corner[0] + ox, corner[1] + oy, 4 + hz, 0.07, 0.07, hz, 0, MT.NEON, ci, 0);

// ---------- sidewalk furniture ----------
const SW_LINES = [
  { axis: 'y', edge: 54, dir: 1, segs: [[7, 53], [73, 121]] },
  { axis: 'y', edge: 74, dir: -1, segs: [[7, 53], [73, 121]] },

  { axis: 'x', edge: 72, dir: -1, segs: [[7, 53], [75, 121]] },
];
function swPos(L, t, dist) { const o = L.edge + L.dir * dist; return L.axis === 'y' ? [o, t] : [t, o]; }
function facadeTileOf(L, t) {
  const o = L.dir > 0 ? L.edge - 1 : L.edge;
  const ti = Math.floor(t);
  return L.axis === 'y' ? ti * W + o : o * W + ti;
}
function placeStreetProps(R) {
  let vendCount = 0, kioskDone = false;
  for (let li = 0; li < SW_LINES.length; li++) {
    const L = SW_LINES[li];
    const yawOut = L.axis === 'y' ? (L.dir > 0 ? 0 : PI) : (L.dir > 0 ? PI / 2 : -PI / 2);
    for (const [a, b] of L.segs) {
      const low = b < 60;
      const step = low ? -13 : 13;
      for (let t = low ? b - 5 : a + 5; t >= a && t <= b; t += step) {
        // street lamp at the curb with an arm over the road
        const [x, y] = swPos(L, t, 3.55);
        addPrim(P_CYL, x, y, 3.1, 0.08, 0, 3.1, 0, MT.POLE, 0, PF_COLLIDE);
        const ax = L.axis === 'y' ? L.dir : 0, ay = L.axis === 'x' ? L.dir : 0;
        addPrim(P_BOX, x + ax * 0.7, y + ay * 0.7, 6.22, ax ? 0.7 : 0.05, ay ? 0.7 : 0.05, 0.05, 0, MT.POLE, 0, 0);
        const r = R.next();
        let col = r < 0.68 ? [1.0, 0.62, 0.30] : r < 0.9 ? [0.62, 0.8, 1.0] : [1.0, 0.35, 0.8];
        const Li = addLight(x + ax * 1.3, y + ay * 1.3, 5.8, 12.5, col[0] * 1.9, col[1] * 1.9, col[2] * 1.9, R.chance(0.12) ? 1 : 0, 0);
        addPrim(P_BOX, x + ax * 1.35, y + ay * 1.35, 6.08, ax ? 0.36 : 0.16, ay ? 0.36 : 0.16, 0.07, 0, MT.LAMP, Li, 0);
        // tree half way to the next lamp
        const tt = t + step / 2;
        if (tt > a + 3 && tt < b - 3 && R.chance(0.65)) {
          const [tx, ty] = swPos(L, tt, 3.2);
          addPrim(P_BOX, tx, ty, 0.22, 0.5, 0.5, 0.22, 0, MT.PLANTER, 0, PF_COLLIDE);
          addPrim(P_CYL, tx, ty, 1.35, 0.12, 0, 1.2, 0, MT.TRUNK, 0, 0);
          addPrim(P_SPH, tx, ty, 3.3, R.range(1.2, 1.55), 0, 0, 0, MT.CANOPY, R.chance(0.3) ? 1 : 0, 0);
        }
      }
      // building side furniture
      for (let t = a + 2.5; t < b - 2; t += R.range(4, 9)) {
        const ft = facadeTileOf(L, t);
        if (bldOf[ft] < 0 || gmat[ft] !== G_LOT || isSolidLevel(ft, 0) === 0) continue;
        if (li === 1 && t > 75 && t < 83) continue;            // noodle bar door
        if (li === 1 && low && t > 6 && t < 32) {               // spawn area: the notice kiosk
          if (!kioskDone && t > 18) {
            const [kx, ky] = swPos(L, t, 0.4);
            const g = interactables.length;
            addPrim(P_BOX, kx, ky, 1.0, 0.3, 0.5, 1.0, yawOut, MT.KIOSK, 0, PF_COLLIDE, g);
            interactables.push({ kind: 'kiosk', x: kx, y: ky, z: 1.3, r: 2.6, group: g });
            addLight(kx + L.dir * 0.9, ky, 1.6, 4, 0.3, 0.6, 1.2, 2, 0);
            kioskDone = true;
          }
          continue;
        }
        const r = R.next();
        if (r < 0.14 && vendCount < 4) {
          const [vx, vy] = swPos(L, t, 0.42);
          const g = interactables.length, ci = R.int(0, NEON.length - 1);
          addPrim(P_BOX, vx, vy, 0.97, 0.38, 0.5, 0.97, yawOut, MT.VEND, ci, PF_COLLIDE, g);
          interactables.push({ kind: 'vending', x: vx, y: vy, z: 1.2, r: 2.4, group: g });
          const c = NEON[ci];
          addLight(vx + (L.axis === 'y' ? L.dir : 0) * 1.1, vy + (L.axis === 'x' ? L.dir : 0) * 1.1, 1.3, 4.5, c[0] * 0.8 + 0.2, c[1] * 0.8 + 0.2, c[2] * 0.8 + 0.2, 0, 0);
          vendCount++;
        } else if (r < 0.45) {
          const [bx, by] = swPos(L, t, 0.45);
          addPrim(P_CYL, bx, by, 0.45, 0.28, 0, 0.45, 0, MT.BIN, 0, PF_COLLIDE);
        } else if (r < 0.62) {
          const [bx, by] = swPos(L, t, 0.5);
          addPrim(P_BOX, bx, by, 0.25, L.axis === 'y' ? 0.25 : 0.9, L.axis === 'y' ? 0.9 : 0.25, 0.25, 0, MT.BENCH, 0, PF_COLLIDE);
        } else if (r < 0.74) {

          addPrim(P_CYL, hx, hy, 0.38, 0.15, 0, 0.38, 0, MT.HYDRANT, 0, PF_COLLIDE);

          const [cx, cy] = swPos(L, t, 0.55);
          addPrim(P_BOX, cx, cy, 0.35, 0.4, 0.4, 0.35, R.range(-0.3, 0.3), MT.CRATE, 0, PF_COLLIDE);
          addPrim(P_BOX, cx, cy, 0.95, 0.3, 0.3, 0.25, R.range(-0.5, 0.5), MT.CRATE, 0, 0);
        }
      }
    }
  }
  // bollards at the four corners
  for (const [x, y] of [[57.6, 57.6], [70.4, 57.6], [57.6, 68.4], [70.4, 68.4]]) addPrim(P_CYL, x, y, 0.5, 0.13, 0, 0.5, 0, MT.BOLLARD, 0, PF_COLLIDE);
}

// ---------- alleys ----------
function decorateAlleys(R) {
  for (const A of alleyRuns) {
    const lanterns = A.axis === 'x' && R.chance(0.5);
    const yaw = A.axis === 'x' ? 0 : PI / 2;
    const at = (t, off) => A.axis === 'x' ? [t, A.c0 + off] : [A.c0 + off, t];
    for (let t = A.a0 + 2; t < A.a1 - 1.5; t += R.range(3.5, 7)) {
      if (Math.abs(t - (A.cross + 1.5)) < 3.3) continue;
      const side = R.chance(0.5) ? 0 : 1, off = side === 0 ? 0.55 : 2.45;
      const r = R.next();
      const [x, y] = at(t, off);
      if (r < 0.35) {
        addPrim(P_BOX, x, y, 0.6, 0.9, 0.45, 0.6, yaw, MT.DUMP, 0, PF_COLLIDE);
      } else if (r < 0.55) {
        addPrim(P_BOX, x, y, 0.35, 0.4, 0.4, 0.35, yaw + R.range(-0.3, 0.3), MT.CRATE, 0, PF_COLLIDE);
        if (R.chance(0.6)) addPrim(P_BOX, x, y, 0.95, 0.32, 0.32, 0.25, yaw + R.range(-0.5, 0.5), MT.CRATE, 0, 0);
      } else if (r < 0.72) {
        addPrim(P_SPH, x, y, 0.28, 0.32, 0, 0, 0, MT.BAG, 0, PF_COLLIDE);
        const [x2, y2] = at(t + 0.5, off + (side === 0 ? 0.25 : -0.25));
        addPrim(P_SPH, x2, y2, 0.24, 0.27, 0, 0, 0, MT.BAG, 0, 0);
      }
    }
    // wall lamps and neon tubes
    for (let t = A.a0 + 4 + R.range(0, 3); t < A.a1 - 2; t += R.range(8, 12)) {
      if (Math.abs(t - (A.cross + 1.5)) < 2.5) continue;
      const side = R.chance(0.5) ? 0 : 1, off = side === 0 ? 0.08 : 2.92;
      const [x, y] = at(t, off);
      const pal = [[1.0, 0.6, 0.25], [0.35, 1.0, 0.5], [1.0, 0.25, 0.75], [0.3, 0.8, 1.0]];
      const c = R.pick(pal);
      if (R.chance(0.35)) {
        const ci = R.int(0, NEON.length - 1);
        addPrim(P_BOX, x, y, 3.2, 0.06, 0.06, 1.2, 0, MT.NEON, ci, 0);
        const cc = NEON[ci];
        addLight(x + (side === 0 ? 1 : -1) * (A.axis === 'y' ? 0.7 : 0), y + (side === 0 ? 1 : -1) * (A.axis === 'x' ? 0.7 : 0), 3.0, 6.5, cc[0], cc[1], cc[2], R.chance(0.4) ? 1 : 0, 0);
      } else {
        addPrim(P_BOX, x, y, 3.3, 0.14, 0.14, 0.1, yaw, MT.WALLLAMP, 0, 0);
        const lx = x + (A.axis === 'y' ? (side === 0 ? 0.6 : -0.6) : 0), ly = y + (A.axis === 'x' ? (side === 0 ? 0.6 : -0.6) : 0);
        const Li = addLight(lx, ly, 3.1, 7, c[0] * 1.2, c[1] * 1.2, c[2] * 1.2, R.chance(0.3) ? 1 : 0, 0);
        pId[nPrim - 1] = Li;
      }
    }
    if (lanterns) {
      let k = 0;
      for (let t = A.a0 + 3; t < A.a1 - 2; t += 2.4, k++) {
        if (Math.abs(t - (A.cross + 1.5)) < 2) continue;
        const [x, y] = at(t, 1.5);
        addPrim(P_SPH, x, y, 3.9 + Math.sin(t) * 0.15, 0.24, 0, 0, 0, MT.LANTERN, 0, 0);
        if (k % 3 === 0) addLight(x, y, 3.5, 5.5, 1.3, 0.3, 0.12, 0, 0);
      }
    }
  }
}

// ---------- distant skyline (drawn in the sky pass) ----------
function makeSkyline(R) {
  let i = 0;
  while (i < SKY_BINS) {
    const run = R.int(2, 7), tall = R.chance(0.12);

  viewW = Math.max(320, window.innerWidth || 1280);
  viewH = Math.max(200, window.innerHeight || 720);
  rows = CFG.rowPresets[CFG.quality];
  chh = Math.max(7, Math.min(CFG.maxCellPx, Math.floor(viewH / rows)));
  cw = Math.max(4, Math.round(chh * CFG.cellAspect));
  const dispCellW = (viewH / rows) * CFG.cellAspect;
  cols = Math.max(60, Math.min(340, Math.round(viewW / dispCellW)));
  canvas.width = cols * cw; canvas.height = rows * chh;
  // glow: one pixel per cell, scaled up and blurred by CSS (no readback of the main canvas)
  glowCanvas.width = cols; glowCanvas.height = rows;
  gImg = gctx.createImageData(cols, rows); gBuf32 = new Uint32Array(gImg.data.buffer);
  NC = cols * rows;
  depthA = new Float32Array(NC); sidA = new Int32Array(NC); glyphA = new Uint8Array(NC);
  colRA = new Uint8Array(NC); colGA = new Uint8Array(NC); colBA = new Uint8Array(NC);
  emisA = new Uint8Array(NC); fogA = new Float32Array(NC);
  if (ctx) { img = ctx.createImageData(canvas.width, canvas.height); buf32 = new Uint32Array(img.data.buffer); }
  cellData = new Uint8Array(NC * 4);
  uArr = new Float32Array(cols); vArr = new Float32Array(rows);
  for (let c = 0; c < cols; c++) uArr[c] = ((c + 0.5) / cols) * 2 - 1;
  for (let r = 0; r < rows; r++) vArr[r] = ((r + 0.5) / rows) * 2 - 1;
  buildGlyphs();
}

function buildGlyphs() {
  const chars = [' '];
  for (const ch of CFG.ramp + '|-_/\\,\'.+') if (!chars.includes(ch)) chars.push(ch);
  const oc = document.createElement('canvas'); oc.width = cw; oc.height = chh;
  const o = oc.getContext('2d', { willReadFrequently: true });
  let fs = Math.max(6, Math.round(chh * 0.95));
  o.font = `bold ${fs}px ${CFG.font}`;
  const mw = o.measureText('M').width || cw;
  if (mw > cw * 1.04) { fs = Math.max(5, Math.floor(fs * cw * 1.04 / mw)); o.font = `bold ${fs}px ${CFG.font}`; }
  o.textAlign = 'center'; o.textBaseline = 'middle'; o.fillStyle = '#fff';
  const offs = [], als = [], cover = [];
  glyphStart = new Int32Array(chars.length); glyphLen = new Int32Array(chars.length);
  const W2 = canvas.width;
  chars.forEach((chr, g) => {
    o.clearRect(0, 0, cw, chh);
    o.fillText(chr, cw / 2, chh / 2 + chh * 0.05);
    const d = o.getImageData(0, 0, cw, chh).data;
    glyphStart[g] = offs.length;
    let sum = 0;
    for (let y = 0; y < chh; y++) for (let x = 0; x < cw; x++) {
      const a = d[(y * cw + x) * 4 + 3];
      if (a > 20) { offs.push(y * W2 + x); als.push(a); sum += a; }
    }
    glyphLen[g] = offs.length - glyphStart[g];
    cover[g] = chr === ' ' ? -1 : sum;
    gIndex[chr] = g;
  });
  glyphOff = Int32Array.from(offs); glyphAl = Uint16Array.from(als);
  const maxCov = Math.max(1, ...cover);
  glyphCov = Float32Array.from(cover, v => Math.max(0, v) / maxCov);
  const rc = Array.from(CFG.ramp).map(ch => gIndex[ch]);
  rc.sort((a, b) => cover[a] - cover[b]);
  rampG = Uint8Array.from(rc); RAMP_MAX = rampG.length - 1;
  if (gl) setupGL(oc, o, chars);
  G_PIPE = gIndex['|']; G_DASH = gIndex['-']; G_UNDER = gIndex['_']; G_SLASH = gIndex['/']; G_BSLASH = gIndex['\\'];
  G_COMMA = gIndex[',']; G_QUOTE = gIndex['\'']; G_DOT = gIndex['.'];
}

// ---------- surface shading ----------
const S = { ar: 0.5, ag: 0.5, ab: 0.5, er: 0.5, eg: 0.5, eb: 0.5, k: 0.5, ind: 0, id: 0, tex: 0.5 };

function shadeVoxel(px, py, pz, nx, ny, nz) {
  const c = HIT.tile, m = HIT.mat;
  const from = nz === 0 ? (HIT.prev >= 0 ? HIT.prev : c) : c;
  const inside = (tflag[from] & F_INDOOR) !== 0;
  S.ind = inside ? 1 : 0;
  const fc = nx > 0 ? 0 : nx < 0 ? 1 : ny > 0 ? 2 : ny < 0 ? 3 : nz > 0 ? 4 : 5;
  const bi = bldOf[c];
  S.id = ((bi + 2) << 3) | fc;
  if (inside || m === V_WALLIN) {
    S.id = (1 << 20) | fc;
    let a = 0.5 + 0.08 * S.tex;
    if (nz < 0) { const gx = px - Math.floor(px), gy = py - Math.floor(py); a = (gx < 0.05 || gy < 0.05) ? 0.25 : 0.42; }
    else if (pz < 0.12) a = 0.2;
    else if (pz > 1.0 && pz < 1.06) a = 0.3;
    S.ar = a * 1.05; S.ag = a * 0.95; S.ab = a * 0.85; S.ind = 1;
    return;
  }
  if (gmat[from] === G_TUNNEL) {
    const a = 0.16 + 0.06 * S.tex;
    S.ar = S.ag = S.ab = a;
    const ns = py < PERIM || py >= D - PERIM;
    const along = ns ? py : px, across = ns ? px : py, mid = ns ? 64 : 63;
    if (nz < 0) { if (Math.abs(across - mid) < 0.35 && along - Math.floor(along / 3) * 3 < 1.8) { S.er = 1.4; S.eg = 0.7; S.eb = 0.25; } }
    else if (pz > 5.2 && pz < 5.45 && along - Math.floor(along / 2) * 2 < 1.4) { S.er = 1.0; S.eg = 0.45; S.eb = 0.12; }
    return;
  }
  if (m === V_ROOFBOX) { const a = ((pz * 5) | 0) & 1 ? 0.22 : 0.32; S.ar = S.ag = S.ab = a; S.k = 0.2; return; }
  if (nz > 0) { const a = 0.13 + 0.08 * hash3((px * 2) | 0, (py * 2) | 0, 3); S.ar = a; S.ag = a; S.ab = a * 1.1; return; }
  if (nz < 0) {
    S.ar = S.ag = S.ab = 0.16;
    const gx = px / 2, gy = py / 2;
    if (Math.abs(gx - Math.floor(gx) - 0.5) < 0.12 && Math.abs(gy - Math.floor(gy) - 0.5) < 0.12 && hash3(gx | 0, gy | 0, 11) > 0.35) { S.er = 1.3; S.eg = 1.0; S.eb = 0.7; }
    return;
  }
  facade(bi, px, py, pz, nx, fc, from);
}

function facade(bi, px, py, pz, nx, fc, from) {
  const b = buildings[bi];
  if (!b) { S.ar = S.ag = S.ab = 0.3; return; }
  const u = nx !== 0 ? py : px;
  const fl = Math.floor(pz / b.floorH), lz = pz - fl * b.floorH;
  const base = 0.56;
  S.ar = b.tr * base; S.ag = b.tg * base; S.ab = b.tb * base; S.k = 0.12;
  if (lz < 0.14) { S.ar *= 1.5; S.ag *= 1.5; S.ab *= 1.5; }
  const g = gmat[from];
  const street = g === G_WALK || g === G_ROAD;
  if (fl === 0 && (street || g === G_ALLEY) && !b.perim && b.style !== ST_GLASS && !b.shop) {
    const sp = 3.5, si = Math.floor(u / sp), su = u - si * sp;
    if (lz > 0.25 && lz < 2.55 && su > 0.3 && su < sp - 0.3) {
      const hs = hash3(bi, si, fc + 40);
      if (hs < (street ? 0.72 : 0.12)) {
        const pal = WINPAL[hs < 0.3 ? 3 : 0];
        const col = pal[((hs * 97) | 0) % pal.length];
        let k = 0.8 + 0.7 * hash3(si, bi, 41);
        if ((((lz * 4) | 0) & 1) === 1) k *= 0.7;
        S.er = col[0] * k; S.eg = col[1] * k; S.eb = col[2] * k;
        S.ar = S.ag = S.ab = 0.04; S.k = 0.8;
      } else {
        const a = (lz * 7) - Math.floor(lz * 7) < 0.45 ? 0.12 : 0.24;
        S.ar = S.ag = S.ab = a; S.k = 0.3;
      }
    }
    return;
  }
  const wi = Math.floor(u / b.pitch), lu = u - wi * b.pitch;
  const inset = (b.pitch - b.winW) * 0.5;
  if (lu > inset && lu < inset + b.winW && lz > b.wz0 && lz < b.wz1) {
    if (lu - inset < 0.07 || inset + b.winW - lu < 0.07 || lz - b.wz0 < 0.07 || b.wz1 - lz < 0.07) { S.ar *= 0.7; S.ag *= 0.7; S.ab *= 0.7; return; }
    const h1 = hash3(bi * 17 + fc, fl, wi);
    if (h1 < b.lit) {
      const h2 = hash3(wi, fl * 3 + fc, bi);
      const pal = WINPAL[b.pal], col = pal[(h2 * pal.length) | 0];
      let k = 0.45 + 0.75 * hash3(fl, wi, bi + 5);
      if (h2 > 0.93) k *= 0.5 + 0.5 * hash3(bi, (time * 7) | 0, wi);
      if (h1 < b.lit * 0.4 && ((((lz - b.wz0) * 7) | 0) & 1)) k *= 0.55;
      S.er = col[0] * k; S.eg = col[1] * k; S.eb = col[2] * k;
      S.ar = S.ag = S.ab = 0.03;
    } else { S.ar = S.ag = S.ab = 0.035; S.k = 0.9; }
  }
}

function roadPaint(px, py, fl) {
  if (fl & F_CROSS) {
    if ((py >= 54 && py < 58) || (py >= 68 && py < 72)) {
      const yy = py < 60 ? py - 54 : py - 68;
      return yy > 0.35 && yy < 3.65 && (px - Math.floor(px)) < 0.5 ? 1 : 0;
    }
    const xx = px < 60 ? px - 54 : px - 70;
    return xx > 0.35 && xx < 3.65 && (py - Math.floor(py)) < 0.5 ? 1 : 0;
  }
  const inAv = px >= 58 && px < 70, inSt = py >= 58 && py < 68;
  if (inAv && inSt) return 0;
  if (inAv) {
    if (Math.abs(px - 63.85) < 0.07 || Math.abs(px - 64.15) < 0.07) return 2;
    if ((Math.abs(px - 60.5) < 0.07 || Math.abs(px - 67.5) < 0.07) && (py / 3) % 1 < 0.5) return 1;
    if (py >= 53.0 && py < 53.4 && px >= 64 && px < 67.5) return 1;
    if (py >= 72.6 && py < 73.0 && px >= 60.5 && px < 64) return 1;
    return 0;
  }
  if (inSt) {
    if (Math.abs(py - 63) < 0.08 && (px / 4) % 1 < 0.55) return 1;
    if ((Math.abs(py - 60) < 0.07 || Math.abs(py - 66) < 0.07) && (px / 3) % 1 < 0.5) return 1;
    if (px >= 53.0 && px < 53.4 && py >= 60 && py < 63) return 1;
    if (px >= 74.6 && px < 75.0 && py >= 63 && py < 66) return 1;
  }
  return 0;
}

function shadeGround(px, py) {
  let tx = px | 0, ty = py | 0;
  if (tx < 0) tx = 0; else if (tx >= W) tx = W - 1;
  if (ty < 0) ty = 0; else if (ty >= D) ty = D - 1;
  const c = ty * W + tx, g = gmat[c];
  S.ind = (tflag[c] & F_INDOOR) ? 1 : 0;
  S.id = 1;
  switch (g) {
    case G_ROAD: case G_TUNNEL: {
      let a = 0.07 + 0.035 * S.tex; S.k = 0.9;
      if (hash3((px * 0.5) | 0, (py * 0.5) | 0, 9) > 0.7) { a *= 0.7; S.k = 1.3; }
      const paint = roadPaint(px, py, tflag[c]);
      if (paint === 1) { S.ar = S.ag = S.ab = 0.5; S.k = 0.35; }
      else if (paint === 2) { S.ar = 0.55; S.ag = 0.4; S.ab = 0.12; S.k = 0.35; }
      else { S.ar = a; S.ag = a; S.ab = a * 1.1; }
      break;
    }
    case G_WALK: {
      const sx = px / 1.5, sy = py / 1.5;
      let a = 0.16 + 0.03 * hash3(Math.floor(sx), Math.floor(sy), 2);
      if (sx - Math.floor(sx) < 0.05 || sy - Math.floor(sy) < 0.05) a = 0.08;
      const inAv = px >= 58 && px < 70, inSt = py >= 58 && py < 68;
      if ((Math.min(Math.abs(px - 58), Math.abs(px - 70)) < 0.2 && !inSt) || (Math.min(Math.abs(py - 58), Math.abs(py - 68)) < 0.2 && !inAv)) a = 0.36;
      S.ar = a; S.ag = a; S.ab = a * 1.05; S.k = 0.12;
      break;
    }
    case G_ALLEY: {
      const a = 0.055 + 0.045 * S.tex;
      S.ar = a * 0.9; S.ag = a; S.ab = a * 0.95;
      S.k = hash3((px * 0.7) | 0, (py * 0.7) | 0, 19) > 0.55 ? 1.1 : 0.2;
      break;
    }
    case G_FLOOR: {
      const a = ((Math.floor(px) + Math.floor(py)) & 1) ? 0.24 : 0.12;
      S.ar = a * 1.05; S.ag = a * 0.95; S.ab = a * 0.9; S.k = 0.3; S.ind = 1;
      break;
    }
    default: S.ar = S.ag = S.ab = 0.08;
  }
}

function shadeSign(p, S, f, u, w) {
  if (f !== 2 && f !== 3) { S.ar = S.ag = S.ab = 0.12; S.k = 0.4; return; }
  const hx = pHX[p], hz = pHZ[p];
  const u01 = f === 2 ? (hx - u) / (2 * hx) : (u + hx) / (2 * hx);
  const v01 = (hz - w) / (2 * hz);
  const n = S.text.length;
  let px = 0, li = 0;
  if (!S.vertical) {
    const gw = n * 4 + 1, gh = 7;
    const gx = Math.min(gw - 1, (u01 * gw) | 0), gy = Math.min(gh - 1, (v01 * gh) | 0);
    if (gx === 0 || gy === 0 || gx === gw - 1 || gy === gh - 1) px = 2;
    else { li = ((gx - 1) / 4) | 0; const col = (gx - 1) % 4, row = gy - 1; if (col < 3 && row < 5 && fontBit(S.text.charCodeAt(li), row, col)) px = 1; }
  } else {
    const gw = 5, gh = n * 6 + 1;
    const gx = Math.min(gw - 1, (u01 * gw) | 0), gy = Math.min(gh - 1, (v01 * gh) | 0);
    if (gx === 0 || gy === 0 || gx === gw - 1 || gy === gh - 1) px = 2;
    else { li = ((gy - 1) / 6) | 0; const row = (gy - 1) % 6, col = gx - 1; if (row < 5 && col < 3 && fontBit(S.text.charCodeAt(li), row, col)) px = 1; }
  }
  const c = S.col;
  S.ar = S.ag = S.ab = 0.05;
  if (px === 1) {
    let on = S.lvl;
    if (li > S.seq) on = 0.06;
    if (li === S.dead) on *= 0.12;
    S.er = c[0] * 2.4 * on; S.eg = c[1] * 2.4 * on; S.eb = c[2] * 2.4 * on;
  } else if (px === 2) {
    const k = 0.9 * S.lvl;
    S.er = S.c2[0] * k; S.eg = S.c2[1] * k; S.eb = S.c2[2] * k;
  } else { S.er = c[0] * 0.06; S.eg = c[1] * 0.06; S.eb = c[2] * 0.06; }
}

function shadeBill(p, B, f, u, w) {
  if (f !== 2) { S.ar = S.ag = S.ab = 0.08; return; }
  const hx = pHX[p], hz = pHZ[p];
  const uu = hx - u, vv = hz - w;
  const lvl = B.lvl;
  S.ar = S.ag = S.ab = 0.03;
  if (uu < 0.12 || vv < 0.12 || uu > 2 * hx - 0.12 || vv > 2 * hz - 0.12) { S.er = B.c2[0] * 0.7 * lvl; S.eg = B.c2[1] * 0.7 * lvl; S.eb = B.c2[2] * 0.7 * lvl; return; }
  let k1 = 0, k2 = 0;
  if (B.mode === 0) {
    const cell = B.cell, total = B.text.length * 4;
    const gx = Math.floor(uu / cell + time * 6 + B.ph * 10);
    const gxm = ((gx % total) + total) % total;
    const rowsN = Math.floor(2 * hz / cell), top = (rowsN - 5) >> 1;
    const gy = Math.floor(vv / cell) - top;
    let on = false;
    if (gy >= 0 && gy < 5) { const li = (gxm / 4) | 0, col = gxm % 4; if (col < 3) on = fontBit(B.text.charCodeAt(li), gy, col) === 1; }
    if (on) k1 = 2.4; else k2 = ((Math.floor(vv / cell) + Math.floor(time * 4)) % 5 === 0) ? 0.25 : 0.05;
  } else if (B.mode === 1) {
    const dx = uu - hx, dy = vv - hz, r = Math.sqrt(dx * dx + dy * dy);
    if (r < 0.45) { S.er = S.eg = S.eb = 2.2 * lvl; return; }
    const ph = r * 1.1 - time * 1.3, band = ph - Math.floor(ph);
    if (band < 0.3) k1 = 1.8; else if (band < 0.45) k2 = 0.6; else k2 = 0.05;
  } else {
    const bw = 0.45, bar = Math.floor(uu / bw), within = uu / bw - bar;
    if (within > 0.8) k2 = 0.02;
    else {
      const hgt = (0.3 + 0.7 * Math.abs(Math.sin(time * (1.3 + hash3(bar, 0, B.idx) * 2) + bar))) * 2 * hz;
      const y = 2 * hz - vv;
      if (y < hgt) { const t = y / (2 * hz); k1 = 1.9 * t; k2 = 1.9 * (1 - t); } else k2 = 0.04;
    }
  }
  S.er = (B.c1[0] * k1 + B.c2[0] * k2) * lvl; S.eg = (B.c1[1] * k1 + B.c2[1] * k2) * lvl; S.eb = (B.c1[2] * k1 + B.c2[2] * k2) * lvl;
}

function shadePrim(px, py, pz) {
  const p = HIT.prim, m = pMat[p], id = pId[p], f = HIT.face, u = HIT.u, v = HIT.v, w = HIT.w;
  let tx = px | 0, ty = py | 0;
  if (tx < 0) tx = 0; else if (tx >= W) tx = W - 1;
  if (ty < 0) ty = 0; else if (ty >= D) ty = D - 1;
  S.ind = (tflag[ty * W + tx] & F_INDOOR) ? 1 : 0;
  S.id = 0x10000000 | (p << 3) | (f & 7);
  S.ar = MA[m * 3]; S.ag = MA[m * 3 + 1]; S.ab = MA[m * 3 + 2]; S.k = MS[m];
  switch (m) {
    case MT.LAMP: if (f === 5) { S.er = lEr[id] * 1.4; S.eg = lEg[id] * 1.4; S.eb = lEb[id] * 1.4; } break;
    case MT.SIGN: shadeSign(p, signs[id], f, u, w); break;
    case MT.BILL: shadeBill(p, bills[id], f, u, w); break;
    case MT.CAR: {
      const moving = id < 1000, C = moving ? cars[id].col : parkedCols[id - 1000];
      S.ar = C[0]; S.ag = C[1]; S.ab = C[2];
      if (f === 0) {
        if (w > -0.05 && Math.abs(v) > 0.52) { if (moving) { S.er = 2.6; S.eg = 2.4; S.eb = 2.0; } else { S.ar = S.ag = S.ab = 0.5; } }
        else { S.ar *= 0.35; S.ag *= 0.35; S.ab *= 0.35; }
      } else if (f === 1) {
        if (w > 0.02 && w < 0.22) { const k = moving ? (cars[id].brake ? 2.4 : 1.1) : 0.25; S.er = 1.0 * k; S.eg = 0.06 * k; S.eb = 0.08 * k; }
      } else if ((f === 2 || f === 3) && Math.abs(w + 0.05) < 0.03) { S.ar *= 0.4; S.ag *= 0.4; S.ab *= 0.4; }
      break;
    }
    case MT.CARGLASS: if (id < 1000 && u > 0.2 && w < -0.1) { S.er = 0.05; S.eg = 0.3; S.eb = 0.35; } break;
    case MT.PEDBODY: {
      const P = peds[id]; S.ar = P.col[0]; S.ag = P.col[1]; S.ab = P.col[2];
      if (P.acc >= 0) { const band = (w + 0.5) * 4; if (band - Math.floor(band) < 0.16) { const c = NEON[P.acc]; S.er = c[0] * 1.5; S.eg = c[1] * 1.5; S.eb = c[2] * 1.5; } }
      break;
    }
    case MT.KEEPER: {
      const front = u * pC[p] + v * pS[p];
      if (front > 0.05 && w < 0.35) { S.ar = 0.55; S.ag = 0.55; S.ab = 0.52; } else { S.ar = 0.12; S.ag = 0.1; S.ab = 0.14; }
      break;
    }
    case MT.PEDHEAD: {
      const P = id >= 0 ? peds[id] : keeper;
      S.ar = P.skin[0]; S.ag = P.skin[1]; S.ab = P.skin[2];
      if (P.visor >= 0 && w > -0.02 && w < 0.045 && u * pC[p] + v * pS[p] > 0.03) { const c = NEON[P.visor]; S.er = c[0] * 1.8; S.eg = c[1] * 1.8; S.eb = c[2] * 1.8; }
      break;
    }
    case MT.UMB: {
      const c = NEON[peds[id].umb];
      if (f === 6 || u * u + v * v > 0.2) { S.er = c[0] * 1.3; S.eg = c[1] * 1.3; S.eb = c[2] * 1.3; }
      break;
    }
    case MT.LEDSTICK: { const c = NEON[peds[id].umb]; S.er = c[0] * 1.8; S.eg = c[1] * 1.8; S.eb = c[2] * 1.8; break; }
    case MT.CANOPY: case MT.PLANT: {
      const n = hash3((px * 3) | 0, (py * 3) | 0, (pz * 3) | 0), k = 0.35 + 0.9 * n;
      S.ar = 0.07 * k; S.ag = 0.24 * k; S.ab = 0.12 * k;
      if (id === 1 && hash3((px * 6) | 0, (py * 6) | 0, (pz * 6) | 0) > 0.93) {
        const c = NEON[(n * 6) | 0], tw = 0.6 + 0.4 * Math.sin(time * 3 + n * 20);
        S.er = c[0] * 1.4 * tw; S.eg = c[1] * 1.4 * tw; S.eb = c[2] * 1.4 * tw;
      }
      break;
    }
    case MT.TLIGHT: if (f === 0) {
      const st = sigState(APPR_GROUP[id]);
      const li = w > 0.18 ? 0 : w > -0.18 ? 1 : 2;
      const lc = w - (li === 0 ? 0.36 : li === 1 ? 0 : -0.36);

function edgePass() {

    case 'ped': return 'talk';
  }
  return 'interact';
}
let fBest = 0, fObj = null, fGroup = -1;
function considerFocus(obj, x, y, z, r, group) {
  const dx = x - cam.x, dy = y - cam.y, dz = z - cam.z;
  const d = Math.sqrt(dx * dx + dy * dy + dz * dz);
  if (d > r || d < 0.05) return;
  const dot = (dx * cam.fx + dy * cam.fy + dz * cam.fz) / d;
  if (dot < 0.82) return;
  const score = dot * 2 - d * 0.25;
  if (score <= fBest) return;
  castRay(cam.x, cam.y, cam.z, dx / d, dy / d, dz / d, d + 0.5);
  if (HIT.t < d - 0.6 && !(HIT.kind === K_PRIM && pGroup[HIT.prim] === group)) return;
  fBest = score; fObj = obj; fGroup = group;
}
function updateFocus() {
  focus = null; hiGroup = -1;
  if (term.open) return;
  fBest = -1e9; fObj = null; fGroup = -1;
  for (const it of interactables) considerFocus(it, it.x, it.y, it.z, it.r, it.group);
  for (let k = 0; k < peds.length; k++) {
    const P = peds[k];
    if (Math.abs(P.x - cam.x) > 3 || Math.abs(P.y - cam.y) > 3) continue;
    considerFocus({ kind: 'ped', ped: P }, P.x, P.y, 1.4 * P.scale, 2.6, 1000 + k);
  }
  if (fObj) { focus = fObj; hiGroup = fGroup; }
}
function openDialog(who, lines, onEnd, hint) {
  dlg.open = true; dlg.who = who; dlg.lines = lines; dlg.i = 0; dlg.shown = 0; dlg.onEnd = onEnd || null;
  dlg.hint = hint || 'e to close'; dlg.sx = player.x; dlg.sy = player.y;
  el.dialog.style.display = 'block'; el.dlgWho.textContent = who;
}
function closeDialog() { dlg.open = false; el.dialog.style.display = 'none'; }
function advanceDialog() {
  const line = dlg.lines[dlg.i];
  if (dlg.shown < line.length) { dlg.shown = line.length; return; }
  dlg.i++; dlg.shown = 0;
  if (dlg.i >= dlg.lines.length) { const f = dlg.onEnd; closeDialog(); if (f) f(); }
}
function updateDialog(dt) {
  if (!dlg.open) return;
  if (Math.hypot(player.x - dlg.sx, player.y - dlg.sy) > 4) { closeDialog(); return; }
  const line = dlg.lines[dlg.i];
  dlg.shown = Math.min(line.length, dlg.shown + dt * 60);
  el.dlgText.textContent = line.slice(0, dlg.shown | 0);
  el.dlgHint.textContent = dlg.i === dlg.lines.length - 1 ? dlg.hint : 'e to continue';
}
function openTerminal() {
  term.open = true; term.shown = 0; term.text = TERM_LINES.join('\n');
  el.term.style.display = 'block';
  state.map = true; state.showMap = true;
}
function closeTerminal() {
  if (!term.open) return;
  term.open = false; el.term.style.display = 'none';
  toast('city map stored. press m to show or hide it.');
}
function updateTerminal(dt) {
  if (!term.open) return;
  term.shown = Math.min(term.text.length, term.shown + dt * 150);
  el.termText.textContent = term.text.slice(0, term.shown | 0) + ((time * 2) % 1 < 0.5 ? '_' : ' ');
}
function interact() {
  if (term.open) { closeTerminal(); return; }
  if (dlg.open) { advanceDialog(); return; }
  if (!focus) return;
  switch (focus.kind) {
    case 'door': door.target = door.target ? 0 : 1; toast(door.target ? 'the door slides open' : 'the door slides shut'); break;
    case 'keeper':
      if (state.credits >= 12) openDialog('the cook', ['Welcome to Blackstar. Sit anywhere that is dry.', 'One bowl of synth-ramen costs 12 cred.', 'Press E to pay. Walk away to skip it.'],
        () => { state.credits -= 12; state.ramen++; toast('paid 12 cred. hot ramen +1'); }, 'e to pay');
      else openDialog('the cook', ['You are short on cred, friend.', 'Come back when the rain pays you.']);
      break;
    case 'terminal': openTerminal(); break;
    case 'vending':
      if (state.credits >= 3) { state.credits -= 3; state.cola++; toast('clunk. synth-cola +1, 3 cred paid'); }
      else toast('not enough cred');
      break;
    case 'kiosk':
      openDialog('city notice', ['Kanal-9 civic notice. Curfew is lifted until further notice.',
        'Blackstar Noodle Bar is open at the north-east corner of the crossing.',
        'Its public terminal holds a city grid map. Guests may download it.',
        'Cross only on the white signal. Cars do not wait for long.']);
      break;
    case 'ped':
      focus.ped.state = 'talk'; focus.ped.timer = 4;
      openDialog('stranger', [BARKS[(pedRng.next() * BARKS.length) | 0]]);
      break;
  }
}

// =====================================================================
// 15. INPUT HANDLING
// =====================================================================
const keys = Object.create(null);
let dragging = false, lastMX = 0, lastMY = 0;
function setQuality(q) {
  CFG.quality = clamp(q, 0, CFG.rowPresets.length - 1);
  resize();
  toast(`detail ${CFG.quality + 1}: ${cols} x ${rows} cells`);
}
function lookDelta(mx, my) {
  player.yaw -= mx * CFG.mouseSens;
  player.pitch = clamp(player.pitch - my * CFG.mouseSens, -1.45, 1.45);
}
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
  if (e.repeat) return;
  switch (e.code) {
    case 'KeyE': if (state.started) interact(); break;
    case 'Escape': closeDialog(); closeTerminal(); break;
    case 'KeyM': if (state.map) state.showMap = !state.showMap; else toast('no map yet. find a public terminal.'); break;
    case 'KeyG': state.glow = !state.glow; glowCanvas.style.display = state.glow ? 'block' : 'none'; toast(state.glow ? 'glow on' : 'glow off'); break;
    case 'KeyR': state.rain = !state.rain; toast(state.rain ? 'rain on' : 'rain off'); break;
    case 'KeyX': state.edges = !state.edges; toast(state.edges ? 'outlines on' : 'outlines off'); break;
    case 'Digit1': case 'Digit2': case 'Digit3': case 'Digit4': setQuality(parseInt(e.code.slice(5), 10) - 1); break;
  }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; dragging = false; });
function startGame() {
  state.started = true;
  el.intro.classList.add('hidden');
  if (canvas.requestPointerLock) {
    try { const r = canvas.requestPointerLock(); if (r && r.catch) r.catch(() => {}); } catch (err) { /* drag look still works */ }
  }
}
el_intro().addEventListener('click', startGame);
canvas.addEventListener('click', () => { if (state.started && document.pointerLockElement !== canvas && canvas.requestPointerLock) { try { const r = canvas.requestPointerLock(); if (r && r.catch) r.catch(() => {}); } catch (err) { /* ignore */ } } });
document.addEventListener('pointerlockchange', () => {
  const locked = document.pointerLockElement === canvas;
  if (locked) state.wasLocked = true;
  else if (state.wasLocked && state.started) { el.intro.classList.remove('hidden'); state.started = false; setIntro(true); }
});
document.addEventListener('mousemove', e => {
  if (document.pointerLockElement === canvas) { lookDelta(e.movementX || 0, e.movementY || 0); return; }
  if (dragging) { lookDelta(e.clientX - lastMX, e.clientY - lastMY); lastMX = e.clientX; lastMY = e.clientY; }
});
canvas.addEventListener('mousedown', e => { if (document.pointerLockElement !== canvas) { dragging = true; lastMX = e.clientX; lastMY = e.clientY; } });
window.addEventListener('mouseup', () => { dragging = false; });

function movePlayer(dt) {
  let fwd = 0, str = 0;
  if (!term.open) {
    if (keys.KeyW) fwd += 1; if (keys.KeyS) fwd -= 1;
    if (keys.KeyD) str += 1; if (keys.KeyA) str -= 1;
    if (keys.ArrowLeft) player.yaw += 2.2 * dt; if (keys.ArrowRight) player.yaw -= 2.2 * dt;
    if (keys.ArrowUp) player.pitch = Math.min(1.45, player.pitch + 1.5 * dt);
    if (keys.ArrowDown) player.pitch = Math.max(-1.45, player.pitch - 1.5 * dt);
  }
  player.sprint = !!(keys.ShiftLeft || keys.ShiftRight);
  const cy = Math.cos(player.yaw), sy = Math.sin(player.yaw);
  let wx = cy * fwd + sy * str, wy = sy * fwd - cy * str;
  const wl = Math.hypot(wx, wy);
  if (wl > 0) { wx /= wl; wy /= wl; }
  const spd = player.sprint ? CFG.sprintSpeed : CFG.walkSpeed;
  const k = Math.min(1, CFG.accel * dt);
  player.vx += (wx * spd - player.vx) * k; player.vy += (wy * spd - player.vy) * k;
  const ox = player.x, oy = player.y;
  const steps = Math.max(1, Math.ceil(Math.hypot(player.vx, player.vy) * dt / 0.15));
  for (let s = 0; s < steps; s++) {
    player.x += player.vx * dt / steps; player.y += player.vy * dt / steps;
    resolveCollisions(player, CFG.radius);
  }
  player.x = clamp(player.x, 6.4, W - 6.4); player.y = clamp(player.y, 6.4, D - 6.4);
  const moved = Math.hypot(player.x - ox, player.y - oy);
  player.vx = (player.x - ox) / dt; player.vy = (player.y - oy) / dt;
  player.speed = moved / dt;
  player.bob += moved * 8.4;
  player.eyeZ = CFG.eyeHeight + Math.sin(player.bob) * 0.04 * Math.min(1, player.speed / 3.4);
}

// =====================================================================
// 16. HUD
// =====================================================================
const el = {};
for (const id of ['hudTop', 'hudMap', 'hudKeys', 'prompt', 'toast', 'dialog', 'dlgWho', 'dlgText', 'dlgHint', 'term', 'termText', 'intro', 'introTitle', 'introText']) el[id] = document.getElementById(id);
function el_intro() { return document.getElementById('intro'); }
function districtName(x, y) {
  const c = (y | 0) * W + (x | 0);
  if (tflag[c] & F_INDOOR) return 'blackstar noodle bar';
  if (x < 6 || y < 6 || x >= 122 || y >= 122) return 'sealed perimeter';
  const inAv = x >= 54 && x < 74, inSt = y >= 54 && y < 72;
  if (inAv && inSt) return 'kanal crossing';
  if (inAv) return y < 54 ? 'avenue 9, south' : 'avenue 9, north';
  if (inSt) return x < 54 ? 'kanal street, west' : 'kanal street, east';
  for (const B of BLOCKS) if (x >= B.x0 && x < B.x1 && y >= B.y0 && y < B.y1) return B.name + ((tflag[c] & F_ALLEY) ? ', back alley' : '');
  return 'kanal-9';
}
const COMPASS = ['n', 'ne', 'e', 'se', 's', 'sw', 'w', 'nw'];
let hudT = 0, mapT = 0, fpsVal = 60, frameMs = 10;
function pad(s, n) { s = String(s); while (s.length < n) s = ' ' + s; return s; }
function updateHUD(dt) {
  el.prompt.textContent = focus && !dlg.open && !term.open ? `[e] ${focusLabel(focus)}` : '';
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) el.toast.textContent = ''; }
  hudT -= dt; mapT -= dt;
  if (hudT <= 0) {
    hudT = 0.15;
    let hd = (90 - player.yaw * 180 / PI) % 360; if (hd < 0) hd += 360;
    const cmp = COMPASS[Math.round(hd / 45) % 8];
    el.hudTop.innerHTML =
      `kanal-9 <i>ascii city</i>   fps <i>${pad(Math.round(fpsVal), 3)}</i>   frame <i>${frameMs.toFixed(1)} ms</i>   grid <i>${cols}x${rows}</i>\n` +
      `pos x <i>${pad(player.x.toFixed(1), 5)}</i>  y <i>${pad(player.y.toFixed(1), 5)}</i>  z <i>${player.eyeZ.toFixed(2)}</i>   heading <i>${pad(Math.round(hd), 3)} ${cmp}</i>\n` +
      `district <i>${districtName(player.x, player.y)}</i>\n` +
      `cred <i>${state.credits}</i>   ramen <i>${state.ramen}</i>   cola <i>${state.cola}</i>   seed <i>${CFG.seed}</i>`;
  }
  const showMap = state.map && state.showMap;
  el.hudMap.classList.toggle('hidden', !showMap);
  if (showMap && mapT <= 0) { mapT = 0.2; renderMap(); }
}
function renderMap() {
  const MW = 35, MH = 19, sx = 2, sy = 3.3;
  const grid = new Array(MW * MH).fill(null);
  const cell = (x, y) => {
    const c = Math.floor((x - player.x) / sx + MW / 2), r = Math.floor(MH / 2 - (y - player.y) / sy);
    return c >= 0 && r >= 0 && c < MW && r < MH ? r * MW + c : -1;
  };
  for (const c of cars) if (c.active) { const k = cell(c.x, c.y); if (k >= 0) grid[k] = '<span class="c">c</span>'; }
  for (const P of peds) { const k = cell(P.x, P.y); if (k >= 0 && !grid[k]) grid[k] = '<span class="h">o</span>'; }
  let hd = (90 - player.yaw * 180 / PI) % 360; if (hd < 0) hd += 360;
  const arrow = ['^', '>', 'v', '<'][Math.round(hd / 90) % 4];
  let out = 'city grid\n';
  for (let r = 0; r < MH; r++) {
    for (let c = 0; c < MW; c++) {
      const k = r * MW + c;
      if (r === (MH >> 1) && c === (MW >> 1)) { out += `<span class="p">${arrow}</span>`; continue; }
      if (grid[k]) { out += grid[k]; continue; }
      const x = Math.floor(player.x + (c - MW / 2 + 0.5) * sx), y = Math.floor(player.y + (MH / 2 - r - 0.5) * sy);
      if (x < 0 || y < 0 || x >= W || y >= D) { out += ' '; continue; }
      const t = y * W + x, g = gmat[t];
      if (tflag[t] & F_INDOOR) out += '_';
      else if ((colLo[t] & 3) !== 0) out += '<span class="b">#</span>';
      else if (g === G_ROAD) out += (tflag[t] & F_CROSS) ? '=' : '.';
      else if (g === G_WALK) out += ':';
      else if (g === G_ALLEY) out += ',';
      else if (g === G_TUNNEL) out += '~';
      else out += ' ';
    }
    out += '\n';
  }
  el.hudMap.innerHTML = out;
}
function setIntro(resume) {
  let title = '';
  const word = 'KANAL-9';
  for (let row = 0; row < 5; row++) {
    let line = '';
    for (const ch of word) {
      for (let col = 0; col < 3; col++) line += fontBit(ch.charCodeAt(0), row, col) ? '##' : '  ';
      line += '  ';
    }
    title += line + '\n';
  }
  el.introTitle.textContent = title;
  el.introText.innerHTML =
    `a walkable ascii city.   seed ${CFG.seed}\n\n` +
    `<b>${resume ? 'click to resume' : 'click to enter the city'}</b>\n\n` +
    `<i>w a s d</i>  walk             <i>mouse</i>  look\n` +
    `<i>shift</i>    sprint           <i>e</i>      interact\n` +
    `<i>esc</i>      release mouse    <i>1 - 4</i>  detail level\n` +
    `<i>g</i> glow   <i>r</i> rain   <i>x</i> outlines   <i>m</i> map\n\n` +
    `start at the notice kiosk to your right.`;
}

// =====================================================================
// 17. GAME LOOP
// =====================================================================
let last = 0;
const perf = { t: 0, acc: 0, n: 0, checks: 0 };
function autoQuality(dt) {
  if (!state.started || perf.checks >= 2) return;
  perf.t += dt; perf.acc += dt; perf.n++;
  if (perf.t >= 3) {
    const avg = perf.acc / perf.n;
    perf.t = 0; perf.acc = 0; perf.n = 0; perf.checks++;
    if (avg > 1 / 38 && CFG.quality > 0) { setQuality(CFG.quality - 1); toast('detail lowered to keep the frame rate up. keys 1 to 4 change it.'); }
  }
}
function update(dt) {
  movePlayer(dt);
  door.open += clamp(door.target - door.open, -dt * 1.6, dt * 1.6);
  const pin = (tflag[(player.y | 0) * W + (player.x | 0)] & F_INDOOR) !== 0;
  const want = pin ? Math.atan2(player.y - keeper.y, player.x - keeper.x) : -PI / 2;
  keeper.h = angleTo(keeper.h, want, 2.5 * dt);
  updatePeds(dt);
  updateCars(dt);
  if (state.rain) updateRain(dt);
  updateSigns();
  updateLights();
  rebuildDynamic();
  updateCamera(dt);
  updateFocus();
  updateDialog(dt);
  updateTerminal(dt);
}
let paused = false;
function frame(now) {
  let dt = last ? (now - last) / 1000 : 0.016;
  last = now;
  if (paused) { requestAnimationFrame(frame); return; }
  if (dt > 0.1) dt = 0.1; else if (dt <= 0) dt = 0.001;
  time += dt; SIG.t += dt;
  update(dt);
  const t0 = performance.now();
  renderScene();
  blit();
  frameMs = frameMs * 0.92 + (performance.now() - t0) * 0.08;
  fpsVal = fpsVal * 0.93 + (1 / dt) * 0.07;
  autoQuality(dt);
  updateHUD(dt);
  requestAnimationFrame(frame);
}
function boot() {
  generateCity(CFG.seed);
  buildPedGraph();
  pedRng = new RNG(CFG.seed ^ 0xa5a5a5);
  carRng = new RNG(CFG.seed ^ 0x5a5a5a);
  spawnPeds(pedRng);
  spawnCars(carRng);
  initFlyers(new RNG(CFG.seed + 7));
  const kiosk = interactables.find(it => it.kind === 'kiosk');
  if (kiosk) { spawn.x = 72.2; spawn.y = kiosk.y - 1.6; spawn.yaw = 98 * PI / 180; }
  player.x = spawn.x; player.y = spawn.y; player.yaw = spawn.yaw;
  initRain();
  resize();
  el.hudKeys.innerHTML = '<i>wasd</i> walk   <i>mouse</i> look   <i>shift</i> sprint   <i>e</i> interact   <i>esc</i> release mouse   <i>1-4</i> detail   <i>g</i> glow   <i>r</i> rain   <i>x</i> outlines   <i>m</i> map';
  setIntro(false);
  let rt = 0;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(resize, 120); });
  rebuildDynamic(); updateCamera(0.016);
  requestAnimationFrame(frame);
  // small debug and test surface
  window.__city = {
    player, cam, state, peds, cars, door, interactables, signs, CFG, alleyRuns, buildings,
    info: () => ({ cols, rows, frameMs, fps: fpsVal, nStatic, nPrim, nLight, lights: nLightS, buildings: buildings.length, gl: !!gl, lightLinks: cStatic, primLinks: lStatic }),
    ascii: () => { const inv = {}; for (const k in gIndex) inv[gIndex[k]] = k; let s = ''; for (let r = 0; r < rows; r++) { for (let c = 0; c < cols; c++) s += inv[glyphA[r * cols + c]]; s += '\n'; } return s; },
    step: (dt) => { time += dt; SIG.t += dt; update(dt); renderScene(); blit(); },
    start: startGame, interact, pause: (v) => { paused = !!v; },
  };
}
boot();
})();
</script>
