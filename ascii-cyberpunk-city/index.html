    }
  }

  // ---------------------------------------------------- animated signs/lights
  function animate(W, env, t) {
    for (const sg of W.signs) {
      const ph = sg.phase;
      switch (sg.anim) {
        case 'flicker': {
          const bad = hash1(Math.floor(t * 0.45 + ph)) < 0.35;
          sg.cur = bad && hash1(Math.floor(t * 17 + ph * 7)) < 0.45 ? 0.07 : 1;
          sg.broken = Math.floor(ph * 7) % sg.text.length;
          sg.brokenOn = hash1(Math.floor(t * 9 + ph * 3)) < 0.5 ? 0.08 : 1;
          break;
        }
        case 'blink': sg.cur = Math.floor(t * sg.speed * 1.1 + ph) & 1 ? 1 : 0.1; break;
        case 'pulse': sg.cur = 0.55 + 0.45 * Math.sin(t * sg.speed * 2.2 + ph); break;
        case 'chase': {
          const n = sg.text.length;
          const c = (t * sg.speed * 3 + ph) % (n + 6);
          sg.chase = c;
          sg.cur = c > n + 2 ? ((c * 4) | 0) & 1 ? 1 : 0.15 : 1;
          break;
        }
        case 'cycle': sg.colCur = [1, 2, 6, 3][Math.floor(t * 0.5 * sg.speed + ph) & 3]; sg.cur = 1; break;
        case 'billboard': sg.scroll = Math.floor(t * sg.speed * 9 + ph); sg.cur = 1; break;
        default: sg.cur = 0.95 + 0.05 * Math.sin(t * 47 + ph);
      }
    }
    // lights follow their sources
    const n = W.nLights, cur = W.lcur, base = W.lbase, anim = W.lanim, prm = W.lparam, mono = W.lmono;
    for (let k = 0; k < n; k++) {
      const b = base[k];
      switch (anim[k]) {
        case LT.STEADY: cur[k] = b; break;
        case LT.FLICKER: {
          const p = prm[k];
          const bad = hash1(Math.floor(t * 0.35 + p)) < 0.45;
          const f = bad && hash1(Math.floor(t * 16 + p * 3)) < 0.5 ? 0.04 : 1;
          cur[k] = b * f * (mono[k] ? env.lampLevel : 1);
          break;
        }
        case LT.SIGN: { const sg = W.signs[prm[k]]; cur[k] = b * (sg ? sg.cur : 1); if (sg && sg.anim === 'cycle') { const c = AC.ACCENT[sg.colCur]; W.lr[k] = c[0]; W.lg[k] = c[1]; W.lb[k] = c[2]; } break; }
        case LT.SIGNAL: {
          const s = env.signal[prm[k] | 0];
          if (s === 0) { W.lr[k] = 0.2; W.lg[k] = 1; W.lb[k] = 0.3; }
          else if (s === 1) { W.lr[k] = 1; W.lg[k] = 0.7; W.lb[k] = 0.1; }
          else { W.lr[k] = 1; W.lg[k] = 0.1; W.lb[k] = 0.08; }
          cur[k] = b;
          break;
        }
        case LT.PULSE: cur[k] = b * (0.8 + 0.2 * Math.sin(t * 2 + prm[k])); break;
        case LT.LAMP: {
          // lamps switch on one by one at dusk
          const on = env.lampLevel > hash1(prm[k] | 0) * 0.85 + 0.05;
          cur[k] = on ? b : 0;
          break;
        }
        default: cur[k] = b;
      }
    }
  }

  function step(E, env, player, dt, t) {
    AC.Environment.signals(env, t);   // signal phase is part of the fixed-step simulation
    updateCars(E, env, player, dt);
    updateHovers(E, dt, t);
    updatePeds(E, env, player, dt);
    updateNpcs(E, dt, t);
    updateDoors(E.W, player, dt);
  }

  return { step, animate, openDoorFor };
})();

// ---- physics.js ------------------------------------------------------------
// ============================================================================
// physics.js — collision against the cell grid, static props and entities
// ----------------------------------------------------------------------------
// Bodies are vertical circles on the ground plane. A cell blocks a body if one
// of its solid spans overlaps the body's vertical extent (feet + step height
// up to head height), so kerbs are stepped over, door lintels are walked
// under, and glass shop fronts stop you. Props are circles or oriented boxes
// looked up through a coarse collider grid; moving cars/walkers/doors are
// supplied each frame by the entity system. Resolution is iterative
// push-out along the shortest separation vector.
// ============================================================================
AC.Physics = (function () {
  'use strict';
  const { wrapDelta } = AC.util;
  let W = null, S = 80, F = null;
  let stamp = null, stampId = 1;

  const STEP = 0.45, HEAD = 1.85;

  function init(world) {
    W = world; S = world.S; F = AC.World.F;
    stamp = new Int32Array(world.colliders.length + 1);
  }

  function blocksBody(ci, zFeet) {
    if (W.flags[ci] & F.GLASS) return true;
    if (W.floorH[ci] > zFeet + STEP) return true;
    const lo = W.spanLo[ci], hi = W.spanHi[ci];
    return hi > lo && lo < zFeet + HEAD && hi > zFeet + STEP;
  }

  // walkable floor height at a point
  function groundAt(x, y) {
    const ci = W.idx(x, y);
    return W.floorH[ci];
  }

  function pushCircle(pos, r, cx, cy, cr) {
    const dx = wrapDelta(pos.x - cx, S), dy = wrapDelta(pos.y - cy, S);
    const d2 = dx * dx + dy * dy, R = r + cr;
    if (d2 >= R * R) return false;
    const d = Math.sqrt(d2);
    if (d < 1e-6) { pos.x += R; return true; }
    const k = (R - d) / d;
    pos.x += dx * k; pos.y += dy * k;
    return true;
  }

  function pushBox(pos, r, bx, by, hx, hy, c, s) {
    const dx = wrapDelta(pos.x - bx, S), dy = wrapDelta(pos.y - by, S);
    const lx = dx * c + dy * s, ly = -dx * s + dy * c;
    const qx = Math.max(-hx, Math.min(hx, lx)), qy = Math.max(-hy, Math.min(hy, ly));
    let ox = lx - qx, oy = ly - qy;
    const d2 = ox * ox + oy * oy;
    if (d2 >= r * r) return false;
    let nlx, nly;
    if (d2 > 1e-9) {
      const d = Math.sqrt(d2), k = (r - d) / d;
      nlx = lx + ox * k; nly = ly + oy * k;
    } else {
      // centre inside the box: exit through the nearest side
      const ex = hx - Math.abs(lx), ey = hy - Math.abs(ly);
      if (ex < ey) { nlx = (lx < 0 ? -1 : 1) * (hx + r); nly = ly; }
      else { nlx = lx; nly = (ly < 0 ? -1 : 1) * (hy + r); }
    }
    const wx = nlx * c - nly * s, wy = nlx * s + nly * c;
    pos.x += wx - dx; pos.y += wy - dy;
    return true;
  }

  // Resolve a circle of radius r against everything solid. `dyn` is an
  // optional list of dynamic colliders; `skipProps` ignores static props.
  function collide(pos, r, zFeet, dyn, skipProps, self) {
    for (let it = 0; it < 4; it++) {
      let moved = false;
      const x0 = Math.floor(pos.x - r), x1 = Math.floor(pos.x + r);
      const y0 = Math.floor(pos.y - r), y1 = Math.floor(pos.y + r);
      for (let gy = y0; gy <= y1; gy++) for (let gx = x0; gx <= x1; gx++) {
        const ci = W.idx(gx, gy);
        if (!blocksBody(ci, zFeet)) continue;
        const cx = Math.max(gx, Math.min(pos.x, gx + 1)), cy = Math.max(gy, Math.min(pos.y, gy + 1));
        const dx = pos.x - cx, dy = pos.y - cy, d2 = dx * dx + dy * dy;
        if (d2 >= r * r) continue;
        if (d2 > 1e-10) {
          const d = Math.sqrt(d2), k = (r - d) / d;
          pos.x += dx * k; pos.y += dy * k;
        } else {
          const l = pos.x - gx, rr = gx + 1 - pos.x, b = pos.y - gy, t = gy + 1 - pos.y;
          const m = Math.min(l, rr, b, t);
          if (m === l) pos.x = gx - r; else if (m === rr) pos.x = gx + 1 + r; else if (m === b) pos.y = gy - r; else pos.y = gy + 1 + r;
        }
        moved = true;
      }
      if (!skipProps) {
        stampId++;
        const cs = W.colGridStart, cl = W.colGridList, C = W.colliders;
        const px = Math.floor(pos.x), py = Math.floor(pos.y);
        for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++) {
          const ci = W.idx(px + ox, py + oy);
          for (let k = cs[ci]; k < cs[ci + 1]; k++) {
            const id = cl[k];
            if (stamp[id] === stampId) continue;
            stamp[id] = stampId;
            const c = C[id];
            if (c.z1 < zFeet + 0.25) continue;
            if (c.t === 'c' ? pushCircle(pos, r, c.x, c.y, c.r) : pushBox(pos, r, c.x, c.y, c.hx, c.hy, c.c, c.s)) moved = true;
          }
        }
      }
      if (dyn) for (let k = 0; k < dyn.length; k++) {
        const c = dyn[k];
        if (c === self || (self && (c.ped === self || c.car === self))) continue;
        if (c.t === 'c' ? pushCircle(pos, r, c.x, c.y, c.r) : pushBox(pos, r, c.x, c.y, c.hx, c.hy, c.c, c.s)) moved = true;
      }
      if (!moved) break;
    }
  }

  return { init, collide, groundAt, blocksBody };
})();

// ---- player.js -------------------------------------------------------------
// ============================================================================
// player.js — first-person body and camera
// ----------------------------------------------------------------------------
// Movement is velocity-smoothed (a little inertia), sub-stepped against the
// collision system, and the camera adds game-feel on top: head bob tied to
// stride, a gentle roll into strafes, and a field-of-view kick when sprinting.
// The player also tracks how many times it has wrapped around the world tile
// so the HUD can report an ever-changing block address.
// ============================================================================
AC.Player = (function () {
  'use strict';
  const { wrapDelta } = AC.util;

  class Player {
    constructor(W, spawn) {
      this.W = W; this.S = W.S;
      this.x = spawn.x; this.y = spawn.y; this.yaw = spawn.yaw; this.pitch = 0.03;
      this.zFeet = AC.Physics.groundAt(this.x, this.y);
      this.vx = 0; this.vy = 0; this.speed = 0;
      this.r = 0.28; this.eye = 1.62;
      this.stepPhase = 0; this.bobAmp = 0; this.fovKick = 0; this.roll = 0;
      this.baseFov = 88 * Math.PI / 180;
      this.tileX = 0; this.tileY = 0;       // wrap counters (for block naming)
      this.sprinting = false; this.onStep = null;
      this.sens = 0.0022;
    }

    update(dt, input, dynColliders) {
      const S = this.S;
      // --- look
      this.yaw -= input.mdx * this.sens;
      this.pitch -= input.mdy * this.sens;
      if (input.key('ArrowLeft')) this.yaw += 2.2 * dt;
      if (input.key('ArrowRight')) this.yaw -= 2.2 * dt;
      if (input.key('ArrowUp')) this.pitch += 1.4 * dt;
      if (input.key('ArrowDown')) this.pitch -= 1.4 * dt;
      this.pitch = Math.max(-1.35, Math.min(1.35, this.pitch));
      this.yaw = Math.atan2(Math.sin(this.yaw), Math.cos(this.yaw));

      // --- move
      const f = (input.key('KeyW') ? 1 : 0) - (input.key('KeyS') ? 1 : 0);
      const s = (input.key('KeyD') ? 1 : 0) - (input.key('KeyA') ? 1 : 0);
      this.sprinting = input.key('ShiftLeft') || input.key('ShiftRight');
      const maxV = this.sprinting ? 7.0 : 3.4;
      const fx = Math.cos(this.yaw), fy = Math.sin(this.yaw), rx = Math.sin(this.yaw), ry = -Math.cos(this.yaw);
      let wx = fx * f + rx * s, wy = fy * f + ry * s;
      const wl = Math.hypot(wx, wy);
      if (wl > 0) { wx = (wx / wl) * maxV; wy = (wy / wl) * maxV; }
      const k = 1 - Math.exp(-dt * (wl > 0 ? 9 : 12));
      this.vx += (wx - this.vx) * k; this.vy += (wy - this.vy) * k;

      const ox = this.x, oy = this.y;
      const dist = Math.hypot(this.vx, this.vy) * dt;
      const n = Math.max(1, Math.ceil(dist / 0.15));
      const pos = { x: this.x, y: this.y };
      for (let i = 0; i < n; i++) {
        pos.x += this.vx * dt / n; pos.y += this.vy * dt / n;
        AC.Physics.collide(pos, this.r, this.zFeet, dynColliders, false, null);
      }
      // wrap + tile counters
      if (pos.x >= S) { pos.x -= S; this.tileX++; } else if (pos.x < 0) { pos.x += S; this.tileX--; }
      if (pos.y >= S) { pos.y -= S; this.tileY++; } else if (pos.y < 0) { pos.y += S; this.tileY--; }
      this.x = pos.x; this.y = pos.y;
      const mvx = wrapDelta(this.x - ox, S) / Math.max(dt, 1e-4), mvy = wrapDelta(this.y - oy, S) / Math.max(dt, 1e-4);
      this.speed = Math.min(12, Math.hypot(mvx, mvy));

      // --- ground following (kerbs, thresholds)
      const g = AC.Physics.groundAt(this.x, this.y);
      if (g > this.zFeet) this.zFeet += (g - this.zFeet) * Math.min(1, dt * 16);
      else this.zFeet = Math.max(g, this.zFeet - dt * 3.5);

      // --- game feel: bob, roll, FOV kick
      const prev = this.stepPhase;
      this.stepPhase += this.speed * dt * (Math.PI / 0.78);
      if (this.onStep && Math.floor(prev / Math.PI) !== Math.floor(this.stepPhase / Math.PI) && this.speed > 0.8) this.onStep(this.speed);
      const targetAmp = Math.min(1.2, this.speed / 3.4);
      this.bobAmp += (targetAmp - this.bobAmp) * Math.min(1, dt * 8);
      const kick = this.sprinting && this.speed > 4 ? 1 : 0;
      this.fovKick += (kick - this.fovKick) * Math.min(1, dt * 5);
      const sway = Math.sin(this.stepPhase) * 0.012 * this.bobAmp;
      this.roll += (-s * 0.03 - input.mdx * 0.00025 + sway - this.roll) * Math.min(1, dt * 7);
    }

    camera() {
      const bob = (0.035 - Math.abs(Math.cos(this.stepPhase)) * 0.07) * this.bobAmp;
      const fov = this.baseFov + this.fovKick * (14 * Math.PI / 180);
      return {
        x: this.x, y: this.y, z: this.zFeet + this.eye + bob,
        yaw: this.yaw, pitch: this.pitch + bob * 0.08, roll: this.roll, tanH: Math.tan(fov / 2),
      };
    }
  }

  return Player;
})();

// ---- raycaster.js ----------------------------------------------------------
// ============================================================================
// raycaster.js — per-character 3D ray casting through the 2.5D cell grid
// ----------------------------------------------------------------------------
// One ray is cast for every character cell of the terminal. Rays are true 3D
// rays (yaw, pitch and roll are all honoured) but they are *traversed* through
// the 2D cell grid with an Amanatides-Woo DDA, which visits exactly the cells
// the ray's footprint crosses, front to back. In each visited cell we know the
// parametric interval [tEnter, tExit] the ray spends inside it, so the height
// of the ray over that interval is known analytically:
//
//     zin  = oz + dz * tEnter        zout = oz + dz * tExit
//
// That is enough to intersect the cell's vertical spans exactly:
//   * entering a span through its side   -> wall hit at tEnter
//   * descending into a span's top       -> floor / roof hit
//   * rising into a span's bottom        -> ceiling hit
// Cells whose content lies entirely below the ray segment are skipped with a
// single comparison (frameTop), which is what makes long street views cheap.
//
// Objects (props, cars, people) registered in the cell are tested with an
// AABB slab test and then per primitive. A per-object "mailbox" stamp makes
// sure each object is tested at most once per ray even if it spans many
// cells. Traversal stops as soon as the next cell starts beyond the best hit.
//
// The world wraps around: cell indices wrap at S, and when an object is tested
// the ray origin is shifted by a multiple of S so the nearest copy is used.
// ============================================================================
AC.Raycaster = (function () {
  'use strict';
  const World = AC.World;
  const PS = World.PS, OS = World.OS;
  const F_GLASS = World.F.GLASS;

  // hit record (monomorphic object -> fast property access)
  const H = (AC.hit = {
    kind: 0, t: 0.5, x: 0.5, y: 0.5, z: 0.5, nx: 0.5, ny: 0.5, nz: 0.5,
    u: 0.5, v: 0.5, w: 0.5, face: 0, mat: 0, prim: -1, cell: 0, key: 0,
    glassT: -1.5, gnx: 0.5, gny: 0.5, gcell: 0, steps: 0,
  });
  H.t = 0; H.x = 0; H.y = 0; H.z = 0;
  // kinds
  const K_NONE = 0, K_FLOOR = 1, K_FLOORSIDE = 2, K_WALL = 3, K_ROOF = 4, K_CEIL = 5, K_PRIM = 6;

  // world refs (re-bound in init)
  let W = null, S = 0, floorH, spanLo, spanHi, flags, frameTop, stStart, stList, dynHead, dynNext, dynObj;
  let prims, objs, objStamp, maxH = 100;
  let rayId = 1;

  function init(world) {
    W = world; S = world.S;
    floorH = world.floorH; spanLo = world.spanLo; spanHi = world.spanHi; flags = world.flags;
    frameTop = world.frameTop; stStart = world.stStart; stList = world.stList;
    dynHead = world.dynHead; dynNext = world.dynNext; dynObj = world.dynObj;
    prims = world.prims; objs = world.objs; objStamp = world.objStamp;
    maxH = world.maxHeight + 1;
  }

  // ------------------------------------------------ primitive intersection
  // scratch outputs of hitPrim, kept in a typed array so writing doubles does
  // not allocate (closure variables holding doubles get boxed on every write)
  const PH = new Float64Array(8); // nx, ny, nz, u, v, w, face, t

  function hitPrim(o, rox, roy, oz, dx, dy, dz, tmin, tmax) {
    const pr = prims;
    const type = pr[o];
    const rx = rox - pr[o + 1], ry = roy - pr[o + 2];
    if (type === 1) { // ---------------- oriented box
      const c = pr[o + 7], s = pr[o + 8], hx = pr[o + 5], hy = pr[o + 6], z0 = pr[o + 3], z1 = pr[o + 4];
      const px = rx * c + ry * s, py = -rx * s + ry * c;
      const ldx = dx * c + dy * s, ldy = -dx * s + dy * c;
      let tn = -1e30, tf = 1e30, ax = 0, sg = 0;
      if (ldx > 1e-9 || ldx < -1e-9) {
        const inv = 1 / ldx;
        let t1 = (-hx - px) * inv, t2 = (hx - px) * inv, g = -1;
        if (t1 > t2) { const tt = t1; t1 = t2; t2 = tt; g = 1; }
        if (t1 > tn) { tn = t1; ax = 0; sg = g; }
        if (t2 < tf) tf = t2;
      } else if (px < -hx || px > hx) return 0;
      if (ldy > 1e-9 || ldy < -1e-9) {
        const inv = 1 / ldy;
        let t1 = (-hy - py) * inv, t2 = (hy - py) * inv, g = -1;
        if (t1 > t2) { const tt = t1; t1 = t2; t2 = tt; g = 1; }
        if (t1 > tn) { tn = t1; ax = 1; sg = g; }
        if (t2 < tf) tf = t2;
      } else if (py < -hy || py > hy) return 0;
      if (dz > 1e-9 || dz < -1e-9) {
        const inv = 1 / dz;
        let t1 = (z0 - oz) * inv, t2 = (z1 - oz) * inv, g = -1;
        if (t1 > t2) { const tt = t1; t1 = t2; t2 = tt; g = 1; }

      else if (ax === 1) { PH[0] = -sg * s; PH[1] = sg * c; PH[2] = 0; PH[6] = sg < 0 ? 2 : 3; }
      else { PH[0] = 0; PH[1] = 0; PH[2] = sg; PH[6] = sg < 0 ? 4 : 5; }

            PH[3] = PH[0]; PH[4] = PH[1]; PH[5] = z - z0; PH[6] = 6;
            PH[7] = t; return 1;
          }
        } else if (cc < 0 && (oz >= z0 && oz <= z1)) return 0; // inside
      } else if (cc > 0) return 0;
      // caps
      let t = -1, top = 0;
      if (dz < 0 && oz > z1) { t = (z1 - oz) / dz; top = 1; }
      else if (dz > 0 && oz < z0) { t = (z0 - oz) / dz; }
      if (t < tmin || t > tmax) return 0;
      const hx = rx + dx * t, hy = ry + dy * t;
      if (hx * hx + hy * hy > r * r) return 0;
      PH[0] = 0; PH[1] = 0; PH[2] = top ? 1 : -1; PH[3] = hx; PH[4] = hy; PH[5] = top ? z1 - z0 : 0; PH[6] = top ? 5 : 4;
      PH[7] = t; return 1;
    } else { // -------------------------- ellipsoid
      const r = pr[o + 5], cz = pr[o + 3], rz = pr[o + 4];
      const k = r / rz;
      const rzv = (oz - cz) * k, dzs = dz * k;
      const a = dx * dx + dy * dy + dzs * dzs;
      const b = rx * dx + ry * dy + rzv * dzs;
      const c = rx * rx + ry * ry + rzv * rzv - r * r;
      const disc = b * b - a * c;
      if (disc < 0 || c < 0) return 0;
      const t = (-b - Math.sqrt(disc)) / a;
      if (t < tmin || t > tmax) return 0;
      const ex = rx + dx * t, ey = ry + dy * t, ez = oz + dz * t - cz;
      let gx = ex, gy = ey, gz = ez * k * k;
      const inv = 1 / Math.sqrt(gx * gx + gy * gy + gz * gz + 1e-12);
      PH[0] = gx * inv; PH[1] = gy * inv; PH[2] = gz * inv;
      PH[3] = ex; PH[4] = ey; PH[5] = ez; PH[6] = 7;
      PH[7] = t; return 1;
    }
  }

  // ------------------------------------------------------------- main cast
  function castRay(ox, oy, oz, dx, dy, dz, maxT) {
    const id = ++rayId;
    const s = S;
    let ix = Math.floor(ox), iy = Math.floor(oy);
    if (ix >= s) ix -= s; else if (ix < 0) ix += s;
    if (iy >= s) iy -= s; else if (iy < 0) iy += s;
    let ux = ix, uy = iy; // unwrapped cell coordinates (relative to origin tile)
    const sx = dx > 0 ? 1 : -1, sy = dy > 0 ? 1 : -1;
    const adx = dx < 0 ? -dx : dx, ady = dy < 0 ? -dy : dy;
    const tdx = adx > 1e-9 ? 1 / adx : 1e30, tdy = ady > 1e-9 ? 1 / ady : 1e30;
    let tmx = adx > 1e-9 ? (dx > 0 ? Math.floor(ox) + 1 - ox : ox - Math.floor(ox)) * tdx : 1e30;
    let tmy = ady > 1e-9 ? (dy > 0 ? Math.floor(oy) + 1 - oy : oy - Math.floor(oy)) * tdy : 1e30;
    let tLim = maxT;
    if (dz > 1e-6) { const t = (maxH - oz) / dz; if (t < tLim) tLim = t; }
    else if (dz < -1e-6) { const t = -oz / dz + 1e-3; if (t < tLim) tLim = t; }

    const mh = W.manholes;

        Q.alb = 0.32 * b.shade;
        const fp = ua / 1.5 - Math.floor(ua / 1.5);
        const h2 = (zf / (b.floorH * 0.5)) % 1;
        if ((fp < 0.035 || h2 < 0.05) && Q.lod < 0.12) Q.alb *= 0.45;
        ramp = R.panel; break;
      }
      case M.BRICK: {
        const row = Math.floor(z / 0.25);
        const bu = (ua + (row & 1) * 0.3) / 0.6;
        const mortar = Q.lod < 0.1 && (z / 0.25 - row < 0.2 || bu - Math.floor(bu) < 0.08);
        Q.alb = mortar ? 0.14 : (0.26 + (Q.lod < 0.2 ? 0.12 * hash2(row, Math.floor(bu)) : 0.05)) * b.shade;
        ramp = R.brick; break;
      }
      case M.GLASSWALL:
        Q.alb = 0.12 * b.shade; Q.spec = 0.8; Q.shin = 40; ramp = R.glass; break;
      case M.INDUSTRIAL: {
        const rib = Q.lod < 0.12 ? 0.5 + 0.5 * Math.cos(ua * TAU / 0.35) : 0.5;
        Q.alb = (0.14 + 0.14 * rib) * b.shade;
        ramp = R.metal; break;
      }
      default: Q.alb = 0.3; ramp = R.wall;
    }
  }

  function groundFloor(b, ua, z, face) {
    const seg = Math.floor(ua / 4.2), fu = ua / 4.2 - seg;
    const st = hash3(b.id, seg, face + 3);
    ramp = R.wall;
    if (z > 3.0) { Q.alb = 0.13; return; }
    if (z < 0.25) { Q.alb = 0.2; return; }
    if (fu < 0.05 || fu > 0.95) { Q.alb = 0.36 * b.shade; ramp = R.panel; return; }
    if (st < 0.34) {
      // rolling shutter
      const rib = ((z * 9) | 0) & 1;
      Q.alb = rib ? 0.34 : 0.22;
      if (rib) gOv = G('=');
      if (hash3(b.id, seg, 99) < 0.22) {
        // spray-paint tag on the shutter
        const tu = (fu - 0.3) / 0.45, tv = (2.1 - z) / 0.55;
        if (tu > 0 && tu < 1 && tv > 0 && tv < 1) {
          const words = ['XX', 'FREE', 'V01D', 'Z3N', 'RUN'];
          const w = words[(hash2(b.id, seg) * words.length) | 0];
          if (Font.sample(w, false, tu, tv, 0) === 1) { tint = [1, 2, 5, 6][seg & 3]; Q.alb = 0.55; gOv = LETTER[Font.lastChar]; }
        }
      }
    } else if (st < 0.62) {
      // lit display window
      if (z > 0.7 && z < 2.8) {
        const I = 0.3 + 0.3 * hash3(b.id, seg, 5);
        const gx = Math.floor(ua * 3), gz = Math.floor(z * 3);
        const p = hash2(gx + b.id * 17, gz);
        const col = hash3(b.id, seg, 6) < 0.5 ? 0 : [1, 2, 3, 6][seg & 3];
        emit(col, I * (p < 0.3 ? 1.7 : 0.8));
        Q.alb = 0.05; ramp = R.window;
        if (p < 0.3) gOv = G(p < 0.1 ? 'o' : p < 0.2 ? '#' : '[');
      } else Q.alb = 0.3;
    } else if (st < 0.84) {
      // dark glass
      if (z > 0.6 && z < 2.8) { Q.alb = 0.04; Q.spec = 1.1; Q.shin = 60; ramp = R.glass; Q.emM += env.daylight * 0.12; }
      else Q.alb = 0.3;
    } else {
      // plain wall with posters
      Q.alb = 0.26 * b.shade;
      const pu = Math.floor(ua / 1.1), pz = z > 0.9 && z < 2.1;
      const ph = hash3(b.id, pu, 7);
      if (pz && ph < 0.5 && (ua / 1.1 - pu) > 0.1 && (ua / 1.1 - pu) < 0.85) {
        tint = [1, 2, 3, 6, 9][((ph * 10) | 0) % 5]; Q.alb = 0.45;
        const gx = Math.floor(ua * 4), gz = Math.floor(z * 4);
        if (hash2(gx, gz) < 0.35) gOv = G(hash2(gz, gx) < 0.5 ? '#' : '=');
      }
    }
  }

  function interiorWall(b, u, z) {
    ramp = R.wall;
    if (b.shop === 'arcade') {
      Q.alb = 0.1;
      if (z > 2.3 && z < 2.42) { emit(((u * 0.5) | 0) & 1 ? 1 : 2, 1.2); gOv = G('='); }
      else if (z > 0.3 && z < 2.1) {
        // retro posters
        const pu = Math.floor(u / 1.6);
        if (hash2(pu, 3) < 0.5 && (u / 1.6 - pu) > 0.15 && (u / 1.6 - pu) < 0.8) {
          emit([1, 2, 6, 3][pu & 3], 0.18); Q.alb = 0.2;
          if (hash2(Math.floor(u * 5), Math.floor(z * 5)) < 0.3) gOv = G('*');
        }
      }
    } else {
      if (z < 1.05) {
        Q.alb = 0.24; const fp = u * 4 - Math.floor(u * 4);
        if (fp < 0.1) Q.alb = 0.1;
      } else if (z < 1.13) Q.alb = 0.45;
      else {
        Q.alb = 0.34;
        const pu = Math.floor(u / 1.3);
        if (z > 1.6 && z < 2.5 && hash2(pu, 9) < 0.45 && (u / 1.3 - pu) > 0.15 && (u / 1.3 - pu) < 0.85) {
          tint = hash2(pu, 10) < 0.5 ? 3 : 1; Q.alb = 0.5;
          if (hash2(Math.floor(u * 6), Math.floor(z * 6)) < 0.4) gOv = G('=');
        }
      }
    }
  }

  function ceiling() {
    Q.alb = 0.12; ramp = R.ledge; indoor = 1;
    const b = W.buildings[bld[H.cell]];
    const fx = H.x * 0.83 - Math.floor(H.x * 0.83), fy = H.y * 0.83 - Math.floor(H.y * 0.83);
    if (fx < 0.03 || fy < 0.03) Q.alb = 0.05;
    if (b && b.ceil) {
      // light panels above every ceiling light
      const L = b.ceilLights;
      if (L) for (let k = 0; k < L.length; k++) {
        const ddx = Math.abs(H.x - L[k][0]), ddy = Math.abs(H.y - L[k][1]);
        if (ddx < 0.6 && ddy < 0.6 && Math.min(ddx, ddy) < 0.22) {
          if (b.shop === 'arcade') emit(L[k][2], 1.5); else Q.emM += 1.6;
          gOv = G('#'); Q.alb = 0.1; break;
        }
      }
    }
  }

  function carpet() {
    Q.alb = 0.08; ramp = R.ground; indoor = 1;
    const gx = Math.floor(H.x * 1.4), gy = Math.floor(H.y * 1.4);
    const h = hash2(gx, gy);
    if (h < 0.2) {
      const px = H.x * 1.4 - gx - 0.5, py = H.y * 1.4 - gy - 0.5;
      let on = false, ch = 'o';
      if (h < 0.07) { const r = Math.sqrt(px * px + py * py); on = Math.abs(r - 0.28) < 0.07; ch = 'o'; }
      else if (h < 0.14) { const d = Math.abs(px) + Math.abs(py); on = d < 0.34 && d > 0.22; ch = '^'; }
      else { on = Math.abs(py - 0.2 * Math.sin(px * 12)) < 0.06 && Math.abs(px) < 0.4; ch = '~'; }
      if (on) { emit([1, 2, 6][(h * 97 | 0) % 3], 0.4); gOv = G(ch); }
    }
  }

  // ---- primitives
  function sideUV(o) {
    // returns u across the face (0..1) for faces 0..3 of a box
    return H.face < 2 ? H.v / (2 * prims[o + 6]) : H.u / (2 * prims[o + 5]);
  }

  function primMaterial(mat, o, dx, dy, dz) {
    const col = prims[o + 10] | 0, A = prims[o + 11], B = prims[o + 12], seed = prims[o + 15];
    const face = H.face;
    switch (mat) {
      case M.POLE: Q.alb = 0.3; Q.spec = 0.4; Q.shin = 20; ramp = R.metal; break;
      case M.PIPE: Q.alb = 0.28; Q.spec = 0.3; ramp = R.metal; if ((H.w % 1.6) < 0.07) Q.alb = 0.45; break;
      case M.LAMP: {
        Q.alb = 0.25; ramp = R.metal;
        if (face === 4) {
          let I = env.lampsOn;
          if (A > 0) { const li = A - 1; I = W.lbase[li] > 0 ? lcur[li] / W.lbase[li] : 0; }
          if (I > 0.05) { Q.emM += 2.6 * I; gOv = G('@'); }
        }
        break;
      }
      case M.TRUNK: Q.alb = 0.24; ramp = R.metal; break;
      case M.LEAVES: {
        const n = vnoise2(H.u * 4.5 + H.w * 2.1 + seed * 3.7, H.v * 4.5 - H.w * 1.7);
        Q.alb = 0.1 + 0.36 * n; ramp = R.leaf;
        if ((seed | 0) % 3 === 0) {
          const g = hash3(Math.floor(H.u * 5), Math.floor(H.v * 5), Math.floor(H.w * 5) + (seed | 0));
          if (g < 0.07) {
            const tw = 0.55 + 0.45 * Math.sin(time * 3 + g * 300);
            emit([2, 1, 3][(seed | 0) % 3 === 0 ? ((seed / 3) | 0) % 3 : 0], 1.6 * tw);
            gOv = G('*');
          }
        }
        break;
      }
      case M.PLANTER: Q.alb = face === 5 ? 0.08 : 0.32; ramp = R.wall; break;
      case M.METAL:
        Q.alb = 0.3; Q.spec = 0.35; ramp = R.metal;
        if (A === 1 && (H.w % 0.3) < 0.05) Q.alb = 0.15;
        break;
      case M.HYDRANT: tint = 4; Q.alb = 0.55; Q.spec = 0.5; ramp = R.body; break;
      case M.BOLLARD:
        Q.alb = 0.3; ramp = R.metal;
        if (H.w > 0.78 && H.w < 0.87) { emit(col || 2, 1.6); gOv = G('='); }
        break;
      case M.CAR_BODY:
        tint = col; Q.alb = A || 0.4; Q.spec = 0.9; Q.shin = 40; ramp = R.body;
        if (H.w < 0.12 && face < 4) Q.alb *= 0.5;
        if (face >= 2 && face <= 3) { const u = H.u; if (Math.abs(u - prims[o + 5] * 1.05) < 0.02) Q.alb *= 0.4; }
        break;
      case M.CAR_CABIN: {
        if (B === 2) { Q.alb = 0.05; Q.spec = 1.3; Q.shin = 60; ramp = R.glass; emit(2, 0.15); break; }
        const hx = prims[o + 5];
        if (face === 5) { tint = col; Q.alb = A || 0.4; Q.spec = 0.8; Q.shin = 40; ramp = R.body; break; }
        let glass = true;
        if (face === 2 || face === 3) {
          const u = H.u;
          if (u < 0.14 || u > 2 * hx - 0.12 || Math.abs(u - hx * (B === 1 ? 1.5 : 0.95)) < 0.06) glass = false;
          if (B === 1 && H.w < 0.35) glass = false;
        } else {
          const u = H.v;
          if (u < 0.1 || u > 2 * prims[o + 6] - 0.1 || H.w < 0.06) glass = false;
        }
        if (glass) { Q.alb = 0.04; Q.spec = 1.3; Q.shin = 60; ramp = R.glass; }
        else { tint = col; Q.alb = A || 0.4; Q.spec = 0.7; ramp = R.body; }
        break;
      }
      case M.HEADLIGHT: {
        Q.alb = 0.35; ramp = R.glow;
        if (B && env.blinkOn) { emit(3, 2.2); gOv = G('*'); }
        else if (A > 0) { emit(7, 3.2); gOv = G('@'); }
        break;
      }
      case M.TAILLIGHT: {
        Q.alb = 0.2; ramp = R.glow;
        const across = H.v, w = 2 * prims[o + 6];
        const blinkEnd = B !== 0 && env.blinkOn && ((B === -1 || B === 2) && across > w - 0.35 || (B === 1 || B === 2) && across < 0.35);
        if (blinkEnd) { emit(3, 2.2); gOv = G('*'); }
        else { emit(col || 4, 0.4 + A * 1.5); gOv = A > 0.8 ? G('#') : G('='); }
        break;
      }
      case M.TIRE: Q.alb = 0.06; ramp = R.tire; break;
      case M.PED_BODY: {
        tint = col; Q.alb = A || 0.3; ramp = R.body;
        if (B > 0 && prims[o] === 1) {
          const f = H.w / (prims[o + 4] - prims[o + 3]);
          if ((f > 0.5 && f < 0.58) || (face < 2 && Math.abs(H.v - prims[o + 6]) < 0.025)) { emit(B | 0, 1.4); gOv = G('='); }
        }
        break;
      }
      case M.PED_SKIN: Q.alb = 0.5; ramp = R.body; break;
      case M.PED_LEGS: Q.alb = 0.15; ramp = R.body; break;
      case M.HAIR: Q.alb = 0.09; ramp = R.body; break;
      case M.VISOR: emit(col || 2, 2.0); gOv = G('='); Q.alb = 0.1; break;
      case M.UMBRELLA: {
        const r = Math.sqrt(H.u * H.u + H.v * H.v), R0 = prims[o + 5];
        ramp = R.glow; Q.alb = 0.1;
        if (r > R0 * 0.84) { emit(col, 1.7); gOv = G('~'); }
        else {
          const ang = Math.atan2(H.v, H.u) / TAU * 8;
          if (ang - Math.floor(ang) < 0.1) { emit(col, 0.9); gOv = G(H.u * H.v > 0 ? '\\' : '/'); }
          else emit(col, 0.24);
        }
        break;
      }
      case M.SIGN: signMat(o, false); break;
      case M.GRAFFITI: signMat(o, true); break;
      case M.BILLBOARD: billboard(o); break;
      case M.SCREEN: screenMat(o); break;
      case M.VENDING: vendingMat(o, col, A); break;
      case M.SIGNAL: signalMat(o, A | 0); break;
      case M.PEDSIGNAL: {
        Q.alb = 0.12; ramp = R.metal;
        if (face === 1) {
          const walk = env.pedWalk[1 - (A | 0)];
          const u = H.v / (2 * prims[o + 6]), v = 1 - H.w / (prims[o + 4] - prims[o + 3]);
          if (u > 0.15 && u < 0.85 && v > 0.12 && v < 0.88) {
            if (walk) { emit(5, 1.6); gOv = G(v < 0.35 ? 'o' : v < 0.7 ? 'Y' : 'A'); }
            else if (!env.pedFlash || env.blinkOn) { emit(4, 1.4); gOv = G(v < 0.5 ? '#' : 'U'); }
          }
        }
        break;
      }
      case M.NEON: {
        const tall = (prims[o + 4] - prims[o + 3]) > 2 * Math.max(prims[o + 5], prims[o + 6]);
        const hum = 0.9 + 0.1 * Math.sin(time * 40 + seed);
        emit(col, 1.9 * (A || 1) * hum); Q.alb = 0.1; ramp = R.glow;
        gOv = G(tall ? '|' : '=');
        break;
      }
      case M.BULB: {
        let I = 1;
        if (A === 1) I = ((time + B) % 1.2) < 0.6 ? 1 : 0.05;
        else if (A === 2) I = ((time * 0.7 + B) % 1.5) < 0.18 ? 1 : 0.08;
        else if (A === 3) I = (Math.floor(time * 7 + B * 2) & 1) ? 1 : 0.05;
        emit(col, 2.6 * I); Q.alb = 0.2; ramp = R.glow;
        gOv = I > 0.5 ? G('@') : G('o');
        break;
      }
      case M.LANTERN: {
        const I = 0.9 + 0.1 * Math.sin(time * 2 + seed);
        const rib = (H.w * 9 + 10) % 1 < 0.22;
        emit(col, (rib ? 0.6 : 1.25) * I); Q.alb = 0.2; ramp = R.glow;
        gOv = G(rib ? '=' : '#');
        break;
      }
      case M.COUNTER:
        Q.alb = 0.26; ramp = R.wall;
        if (face < 4 && H.w < 0.12) { emit(col || 1, 1.5); gOv = G('='); }
        else if (face < 4 && (H.u * 3) % 1 < 0.08) Q.alb = 0.12;
        break;
      case M.WOOD: Q.alb = 0.26 + 0.08 * Math.sin((H.u + H.v) * 25 + vnoise2(H.u * 3, H.w * 3) * 4); ramp = R.wall; break;
      case M.STOOL: tint = col; Q.alb = 0.5; Q.spec = 0.5; ramp = R.body; break;
      case M.DUMPSTER:
        Q.alb = 0.2; ramp = R.metal;
        if (face < 4 && (H.u * 3) % 1 < 0.12) Q.alb = 0.1;
        break;
      case M.CRATE: Q.alb = 0.28; ramp = R.wall; if ((H.w * 5) % 1 < 0.15) Q.alb = 0.12; break;
      case M.AC_UNIT: {
        Q.alb = 0.3; ramp = R.metal;
        if (face === 1) {
          const u = H.v - prims[o + 6], w = H.w - (prims[o + 4] - prims[o + 3]) * 0.5;
          const r = Math.sqrt(u * u + w * w);
          if (r < 0.2) {
            if (r > 0.17) { Q.alb = 0.45; gOv = G('O'); }
            else { Q.alb = 0.35; gOv = G('|/-\\'[Math.floor(time * 12 + (seed | 0)) & 3]); }
          } else if ((H.w * 14) % 1 < 0.5) { Q.alb = 0.2; gOv = G('='); }
        }
        break;
      }
      case M.TANK:
        Q.alb = 0.26; ramp = R.wall;
        if (H.w % 1.0 < 0.08) { Q.alb = 0.45; gOv = G('='); }
        break;
      case M.AWNING: {
        const st = (H.u * 2) % 1 < 0.5;
        if (st) { tint = col; Q.alb = 0.5; } else Q.alb = 0.22;
        ramp = R.wall; if (face === 4) Q.alb *= 0.4;
        break;
      }
      case M.CABINET:
        Q.alb = 0.13; ramp = R.metal;
        if (face === 2 || face === 3) {
          if ((H.u * 2 + H.w * 2) % 1 < 0.14) { emit(col, 0.6); gOv = G('/'); }
        }
        break;
      case M.KIOSK:
        Q.alb = 0.24; ramp = R.metal;
        if (H.w > 0.9 && H.w < 1.0) { emit(2, 1.2); gOv = G('='); }
        break;
      case M.DOOR: doorMat(o, col); break;
      case M.HOVER:
        tint = col; Q.alb = 0.32; Q.spec = 1.0; Q.shin = 30; ramp = R.body;
        if (face === 4) Q.alb = 0.1;
        break;
      default: Q.alb = 0.3; ramp = R.def;
    }
  }

  function signMat(o, graffiti) {
    const face = H.face;
    const sg = W.signs[prims[o + 11] | 0];
    if (!sg || (face !== 2 && face !== 3)) { Q.alb = 0.18; ramp = R.metal; return; }
    const hx = prims[o + 5], z0 = prims[o + 3], z1 = prims[o + 4];
    let u = H.u / (2 * hx);
    if (face === 3) u = 1 - u;
    const v = 1 - H.w / (z1 - z0);
    const res = Font.sample(sg.text, sg.vertical, u, v, sg.scroll);
    const col = sg.colCur;
    if (graffiti) {
      Q.alb = 0.16; ramp = R.wall;
      if (res === 1) {
        const drip = hash2(Math.floor(u * 60), 3) < 0.08;
        tint = col; Q.alb = 0.38; gOv = LETTER[Font.lastChar];
        if (drip) gOv = G('|');
      }
      return;
    }
    let I = sg.cur;
    if (sg.anim === 'chase' && res === 1) {
      const ci = Font.lastIndex;
      I *= ci < sg.chase ? 1 : 0.1;
    }
    if (sg.broken >= 0 && res === 1 && Font.lastIndex === sg.broken) I *= sg.brokenOn;
    Q.alb = 0.08;
    // letters are painted with their own character when each font pixel spans
    // several screen cells, otherwise with solid blocks so they stay legible
    const px = sg.vertical ? (2 * hx) / 7 : (z1 - z0) / 9;
    if (res === 1) { emit(col, 1.8 * I); gOv = Q.lod < px * 0.34 ? LETTER[Font.lastChar] : G_HASH; ramp = R.glow; }
    else if (res === 2) { emit(col, 0.5 * I); gOv = G(sg.vertical ? '|' : '='); }
    else { emit(col, 0.05 * I); ramp = R.def; }
  }

  function billboard(o) {
    const face = H.face;
    const sg = W.signs[prims[o + 11] | 0];
    if (!sg || (face !== 2 && face !== 3)) { Q.alb = 0.18; ramp = R.metal; return; }
    const mode = prims[o + 12] | 0;
    const hx = prims[o + 5], z0 = prims[o + 3], z1 = prims[o + 4];
    let u = H.u / (2 * hx);
    if (face === 3) u = 1 - u;
    const v = 1 - H.w / (z1 - z0);
    const col = sg.colCur;
    const col2 = mode ? 6 : 2;
    Q.alb = 0.05; ramp = R.glow;
    if (u < 0.015 || u > 0.985 || v < 0.03 || v > 0.97) { emit(col, 0.7); gOv = G(v < 0.03 || v > 0.97 ? '=' : '|'); return; }
    // scanline flicker
    const scan = 0.85 + 0.15 * Math.sin(v * 90 - time * 12);
    if (v > 0.7) {
      const vv = (v - 0.7) / 0.27;
      const n = sg.text.length, cols = n * 6 + 1;
      const res = Font.sample(sg.text, false, u * 61 / cols, vv, sg.scroll);
      if (res === 1) { emit(col, 2.0 * scan); gOv = LETTER[Font.lastChar]; }
      else emit(col, 0.07);
      return;
    }
    const aspect = (2 * hx) / ((z1 - z0) * 0.7);
    const cx = (u - 0.5) * aspect * 2, cy = (v / 0.7 - 0.5) * 2;
    if (mode === 0) {
      // a giant watching eye
      const blink = Math.max(0, Math.sin(time * 0.9)) > 0.985 ? 0.08 : 1;
      const lid = Math.abs(cy) < 0.72 * blink * Math.cos(Math.min(1.5, Math.abs(cx) * 0.62));
      const lookX = Math.sin(time * 0.37) * 0.45, lookY = Math.sin(time * 0.53) * 0.15;
      const ex = cx - lookX, ey = cy - lookY;
      const r = Math.sqrt(ex * ex + ey * ey);
      if (lid) {
        if (r < 0.18) { Q.emM += 0.02; gOv = G(' '); }
        else if (r < 0.5) {
          const ring = Math.sin(r * 40 - time * 3);
          emit(col2, (0.8 + 0.6 * ring) * scan); gOv = G(ring > 0.3 ? '@' : ring > -0.3 ? 'O' : 'o');
        } else { Q.emM += 0.55 * scan; gOv = G(r < 0.56 ? '#' : ':'); }
      } else {
        const d = Math.abs(cx) + Math.abs(cy);
        const w = Math.sin(d * 10 - time * 2.5);
        if (w > 0.6) { emit(col, 0.5); gOv = G('/'); } else emit(col, 0.06);

// ---- particles.js ----------------------------------------------------------
// ============================================================================
// particles.js — rain, splashes and steam, rendered as depth-tested glyphs
// ----------------------------------------------------------------------------
// Particles live in world space around the camera. They are projected into
// the character grid after the scene pass and only drawn where they are in
// front of the depth stored for that cell (gT), so rain falls *between*
// buildings and steam rises behind lamp posts. Rain streaks pick their glyph
// ( | / \ ) from the streak's projected screen slope, and add their light to
// whatever is behind them, so drops in front of neon glow in that colour.
// ============================================================================
AC.Particles = (function () {
  'use strict';
  const { RNG, wrap, wrapDelta, hash3 } = AC.util;
  const RC = AC.Raycaster;
  const MAX_RAIN = 1100, MAX_SPLASH = 256, MAX_STEAM = 420;
  let W = null, S = 80, rng = null, G = null;
  const rx = new Float32Array(MAX_RAIN), ry = new Float32Array(MAX_RAIN), rz = new Float32Array(MAX_RAIN), rs = new Float32Array(MAX_RAIN);
  let nRain = 0;
  const sx = new Float32Array(MAX_SPLASH), sy = new Float32Array(MAX_SPLASH), sz = new Float32Array(MAX_SPLASH), sa = new Float32Array(MAX_SPLASH);
  let sHead = 0;
  const px = new Float32Array(MAX_STEAM), py = new Float32Array(MAX_STEAM), pz = new Float32Array(MAX_STEAM), pa = new Float32Array(MAX_STEAM),
    pl = new Float32Array(MAX_STEAM), pvx = new Float32Array(MAX_STEAM), pvy = new Float32Array(MAX_STEAM), pvz = new Float32Array(MAX_STEAM), pSize = new Float32Array(MAX_STEAM);
  let nSteam = 0;
  const emitAcc = [];
  let windX = 1.4, windY = 0.5;
  let gBar, gSl, gBs, gDot, gCom, gCol, STEAMG;

  function init(world, seed) {
    W = world; S = world.S; rng = new RNG(seed);
    sa.fill(99);
    G = AC.Glyphs.index;
    gBar = G('|'); gSl = G('/'); gBs = G('\\'); gDot = G('.'); gCom = G(','); gCol = G(':');
    STEAMG = Array.from(' .:;oO').map(G);
    for (let i = 0; i < world.emitters.length; i++) emitAcc.push(0);
  }

  function covered(x, y, z) {
    const ci = W.idx(x, y);
    const lo = W.spanLo[ci], hi = W.spanHi[ci];
    if (hi > lo && z < hi) return true; // inside a building or below a ceiling/awning line
    return z < W.floorH[ci];
  }

  // drops are spawned with a density that falls off with distance (sqrt of a
  // uniform radius gives uniform area density; using the radius directly
  // concentrates drops near the camera where each streak is visible)
  function respawnDrop(i, cam, anyZ) {
    const a = rng.next() * Math.PI * 2, r = 0.6 + Math.pow(rng.next(), 0.8) * 17;
    rx[i] = wrap(cam.x + Math.cos(a) * r, S);
    ry[i] = wrap(cam.y + Math.sin(a) * r, S);
    rz[i] = anyZ ? rng.range(0, cam.z + 12) : cam.z + rng.range(6, 12);
    rs[i] = rng.range(13, 17);
  }

  function update(dt, cam, env, t) {
    windX = 2.6 + Math.sin(t * 0.13) * 1.2; windY = 1.2 + Math.sin(t * 0.07) * 0.8;
    // --- rain
    const want = Math.floor(env.rain * 900);
    while (nRain < want) { respawnDrop(nRain, cam, true); nRain++; }
    if (nRain > want) nRain = want;
    for (let i = 0; i < nRain; i++) {
      rz[i] -= rs[i] * dt;
      rx[i] += windX * dt; ry[i] += windY * dt;
      const dx = wrapDelta(rx[i] - cam.x, S), dy = wrapDelta(ry[i] - cam.y, S);
      if (dx * dx + dy * dy > 330) { respawnDrop(i, cam, true); continue; }

      const fl = W.floorH[ci];
      const lo = W.spanLo[ci], hi = W.spanHi[ci];

        if (rz[i] <= fl + 0.05 && !(hi > lo) && dx * dx + dy * dy < 200) {
          sx[sHead] = rx[i]; sy[sHead] = ry[i]; sz[sHead] = fl + 0.03; sa[sHead] = 0;
          sHead = (sHead + 1) % MAX_SPLASH;
        }
        respawnDrop(i, cam, false);
      }
    }
    for (let i = 0; i < MAX_SPLASH; i++) sa[i] += dt;
    // --- steam
    const E = W.emitters;
    for (let e = 0; e < E.length; e++) {
      const em = E[e];

    }

      pa[k] += dt;
      if (pa[k] >= pl[k]) {
        nSteam--;

  const RAIN = [0.62, 0.8, 1.0];

    const cols = scr.cols;

    RC.setupProjection(cam, scr);

    // rain streaks: project the drop and the tail of its motion-blur segment,
    // then walk the characters between them
    const blur = 0.06;
    for (let i = 0; i < nRain; i++) {
      if (!RC.project(rx[i], ry[i], rz[i])) continue;
      const c0 = proj.col, r0 = proj.row, dist = proj.dist;
      if (dist > 20) continue;
      if (!RC.project(rx[i] - windX * blur, ry[i] - windY * blur, rz[i] + rs[i] * blur)) continue;
      const c1 = proj.col, r1 = proj.row;
      const dc = c1 - c0, dr = r1 - r0;
      const fade = 1 - dist / 20;
      const add = 50 + 150 * fade * fade;
      let g = gBar;
      if (Math.abs(dc) > Math.abs(dr) * 0.5) g = dc * dr < 0 ? gSl : gBs;
      if (dist > 13) g = gCol;
      const n = Math.min(4, Math.max(1, Math.round(Math.max(Math.abs(dr), Math.abs(dc)))));
      for (let k = 0; k < n; k++) {
        const f = n === 1 ? 0 : k / (n - 1);
        put(scr, c0 + dc * f, r0 + dr * f, dist, g, add * (1 - f * 0.5), env);
      }
    }
    // splashes
    for (let k = 0; k < MAX_SPLASH; k++) {
      if (sa[k] > 0.16) continue;
      if (!RC.project(sx[k], sy[k], sz[k])) continue;
      put(scr, proj.col, proj.row, proj.dist - 0.05, sa[k] < 0.07 ? gDot : gCom, 90, env);
    }
    // steam puffs: small noisy discs
    const tanH = cam.tanH, cols = scr.cols;
    for (let k = 0; k < nSteam; k++) {
      if (!RC.project(px[k], py[k], pz[k])) continue;
      const dist = proj.dist, cc = proj.col, rr = proj.row;
      const life = pa[k] / pl[k];
      const dens = (life < 0.15 ? life / 0.15 : 1 - (life - 0.15) / 0.85) * 0.85;
      const radC = (pSize[k] / proj.depth) / tanH * cols * 0.5;
      const radR = radC * scr.CW / scr.CH;
      const rc = Math.min(8, Math.ceil(radC)), rw = Math.min(6, Math.ceil(radR));

        const nx = ox / Math.max(radC, 0.5), ny = oy / Math.max(radR, 0.5);
        const d2 = nx * nx + ny * ny;
        if (d2 > 1) continue;
        const n = hash3((cc + ox) | 0, (rr + oy) | 0, (frame >> 2) + k);
        const v = dens * (1 - d2) * (0.6 + 0.4 * n);
        if (v < 0.12) continue;
        const g = STEAMG[Math.min(5, (v * 6) | 0)];
        const col = (cc + ox) | 0, row = (rr + oy) | 0;

        const i = row * cols + col;
        if (dist >= scr.gT[i]) continue;
        const add = 60 * v;
        scr.glyph[i] = g;
        const P = env.phosphor;
        scr.fr[i] = scr.fr[i] * 0.6 + P[0] * add + 25 * v; scr.fg[i] = scr.fg[i] * 0.6 + P[1] * add + 25 * v; scr.fb[i] = scr.fb[i] * 0.6 + P[2] * add + 25 * v;

})();

// ---- hud.js ----------------------------------------------------------------
// ============================================================================
// hud.js — terminal HUD drawn into the same character grid as the world
// ----------------------------------------------------------------------------
// Status bar (FPS, position, heading, district/block, time), control strip,
// crosshair + interaction prompt, message log, ASCII minimap, boot sequence
// and the "click to jack in" overlay. Everything is plain text written into
// the display buffers after the 3D pass, so it inherits the CRT treatment.
// ============================================================================
AC.HUD = (function () {
  'use strict';
  const Scr = AC.Screen;
  const { hash2 } = AC.util;
  const F = AC.World.F;
  const msgs = [];
  const DISTRICTS = ['KABUKI-7', 'NEO SHINJUKU', 'CHROME BAY', 'LOWER SPRAWL', 'NIGHT MARKET', 'OLD HARBOR', 'GLASS FLATS', 'DEADWIRE'];
  const AVES = ['KABUKI AVE', 'RONIN AVE', 'SPRAWL AVE', 'CIRCUIT AVE', 'LOTUS AVE', 'MERIDIAN AVE'];
  const STREETS = ['NEON ST', 'WIRE ST', 'CANAL ST', 'HALO ST', 'RUST ST', 'ECHO ST'];
  const mod = (a, n) => ((a % n) + n) % n;
  const pad = (n, w) => { const s = String(Math.abs(n)); return (n < 0 ? '-' : '') + '0'.repeat(Math.max(0, w - s.length)) + s; };

  function message(text, dur, col) { msgs.push({ text, t: 0, dur: dur || 3.2, col: col || 0 }); if (msgs.length > 4) msgs.shift(); }

  function location(W, p) {
    const x = p.x, y = p.y, ci = W.idx(x, y), f = W.flags[ci];
    const tx = p.tileX, ty = p.tileY;
    const ave = AVES[mod(tx, AVES.length)], st = STREETS[mod(ty, STREETS.length)];
    const district = DISTRICTS[Math.floor(hash2(Math.floor(tx / 2), Math.floor(ty / 2)) * DISTRICTS.length)];
    const block = String.fromCharCode(65 + mod(ty, 26)) + '-' + pad(mod(tx, 100), 2);
    let place;
    if (f & F.INTERIOR || f & F.DOOR) {
      const b = W.buildings[W.bld[ci]];
      place = b ? (b.displayName || b.name) : 'INTERIOR';
    } else if (x < 16 && y < 16) place = (x >= 3 && x < 13 && y >= 3 && y < 13) ? ave + ' x ' + st : 'CORNER ' + ave.split(' ')[0] + '/' + st.split(' ')[0];
    else if (x < 16) place = ave;
    else if (y < 16) place = st;
    else if (f & F.ALLEY) place = 'BACK ALLEY';
    else { const b = W.buildings[W.bld[ci]]; place = b ? b.name : 'BLOCK'; }
    return { district, block, place };
  }

  function heading(yaw) {
    let deg = Math.round(90 - yaw * 180 / Math.PI); // compass: 0 = north (+y)
    deg = mod(deg, 360);
    const names = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
    return pad(deg, 3) + ' ' + names[Math.round(deg / 45) % 8];
  }

  function draw(st, dt) {
    const s = Scr.scr, cols = s.cols, rows = s.rows;
    const P = st.env.phosphor;
    const fr = P[0] * 255, fg = P[1] * 255, fb = P[2] * 255;
    const T = (c, r, str, k, bg) => Scr.text(c, r, str, fr * (k || 1), fg * (k || 1), fb * (k || 1), bg ? bg[0] : undefined, bg ? bg[1] : undefined, bg ? bg[2] : undefined);
    const inv = [fr * 0.82, fg * 0.82, fb * 0.82];
    const loc = location(st.W, st.player);

    // ---- top status bar (inverse video)
    Scr.fill(0, 0, cols, 1, ' ', 0, 0, 0, inv[0], inv[1], inv[2]);
    const p = st.player;
    const left = ` NEON//GRID ▌ ${pad(Math.round(st.fps), 3)} FPS ▌ POS ${p.x.toFixed(1).padStart(5, '0')} ${p.y.toFixed(1).padStart(5, '0')} ▌ HDG ${heading(p.yaw)} ▌ ${loc.district} // BLOCK ${loc.block} // ${loc.place}`;
    const right = `${AC.Environment.timeString(st.env)} ${AC.Environment.phaseName(st.env)} ▌ ${st.env.rain > 0 ? (st.env.rain > 0.7 ? 'HEAVY RAIN' : 'RAIN') : 'DRY'} `;
    Scr.text(0, 0, left.slice(0, Math.max(0, cols - right.length - 1)), 0, 0, 0, inv[0], inv[1], inv[2]);
    Scr.text(cols - right.length, 0, right, 0, 0, 0, inv[0], inv[1], inv[2]);

    // ---- bottom control strip
    Scr.fill(0, rows - 1, cols, 1, ' ', 0, 0, 0, fr * 0.16, fg * 0.16, fb * 0.16);
    const ctl = ' [WASD] MOVE  [MOUSE] LOOK  [SHIFT] SPRINT  [E] INTERACT  [ESC] RELEASE  ▌ [T] TIME  [R] RAIN  [P] PHOSPHOR  [M] MAP  [-/=] RES  [G] GLOW  [H] HELP';
    const info = `${s.cols}x${s.rows} ${st.stats.rayMs.toFixed(1)}ms `;
    Scr.text(0, rows - 1, ctl.slice(0, Math.max(0, cols - info.length - 1)), fr * 0.85, fg * 0.85, fb * 0.85, fr * 0.16, fg * 0.16, fb * 0.16);
    Scr.text(cols - info.length, rows - 1, info, fr * 0.5, fg * 0.5, fb * 0.5, fr * 0.16, fg * 0.16, fb * 0.16);

    // ---- crosshair + prompt
    const cx = cols >> 1, cy = rows >> 1;
    T(cx, cy, '+', 0.55);
    if (st.prompt) {
      const txt = '[E] ' + st.prompt;
      T(cx - (txt.length >> 1), cy + 2, txt, 1.0, [0, 0, 0]);
    }

    // ---- messages
    let row = rows - 3;
    for (let k = msgs.length - 1; k >= 0; k--) {
      const m = msgs[k];
      m.t += dt;
      if (m.t > m.dur) { msgs.splice(k, 1); continue; }
      const a = Math.min(1, (m.dur - m.t) * 2) * Math.min(1, m.t * 8);
      const txt = '> ' + m.text + (m.t < 0.6 && (m.t * 10 | 0) & 1 ? '_' : ' ');
      const c = m.col ? AC.ACCENT[m.col] : P;
      Scr.text(cx - (txt.length >> 1), row, txt, c[0] * 255 * a, c[1] * 255 * a, c[2] * 255 * a, 0, 0, 0);
      row--;
    }

    if (st.mapOn) minimap(st, cols - 30, 2, 28, 13, fr, fg, fb);
    if (st.helpOn) help(st, fr, fg, fb);
    if (st.boot < 3.2) boot(st, fr, fg, fb);
    else if (!st.locked) overlay(st, fr, fg, fb);
  }

  function box(c0, r0, w, h, fr, fg, fb, title) {
    const bg = [0, 0, 0];
    Scr.fill(c0, r0, w, h, ' ', 0, 0, 0, bg[0], bg[1], bg[2]);
    const k = 0.7;
    Scr.text(c0, r0, '┌' + '─'.repeat(w - 2) + '┐', fr * k, fg * k, fb * k);
    Scr.text(c0, r0 + h - 1, '└' + '─'.repeat(w - 2) + '┘', fr * k, fg * k, fb * k);
    for (let r = r0 + 1; r < r0 + h - 1; r++) { Scr.text(c0, r, '│', fr * k, fg * k, fb * k); Scr.text(c0 + w - 1, r, '│', fr * k, fg * k, fb * k); }
    if (title) Scr.text(c0 + 2, r0, ' ' + title + ' ', fr, fg, fb);
  }

  function minimap(st, c0, r0, w, h, fr, fg, fb) {
    const W = st.W, p = st.player, S = W.S;
    box(c0, r0, w, h, fr, fg, fb, 'MAP');
    const sxs = 2.2, sys = 4.0;
    const cars = st.ents.cars, peds = st.ents.peds;
    for (let r = 1; r < h - 1; r++) for (let c = 1; c < w - 1; c++) {
      const wx = p.x + (c - w / 2) * sxs, wy = p.y + (h / 2 - r) * sys;
      const ci = W.idx(wx, wy), f = W.flags[ci];
      let ch = ' ', k = 0.3;
      if (f & F.INTERIOR) { ch = '+'; k = 0.5; }
      else if (f & F.DOOR) { ch = 'D'; k = 0.8; }
      else if (f & F.BUILDING) { ch = '#'; k = W.spanHi[ci] > 30 ? 0.55 : 0.35; }
      else if (f & F.SIDEWALK) { ch = '.'; k = 0.35; }
      else if (f & F.ALLEY) { ch = ':'; k = 0.3; }
      Scr.text(c0 + c, r0 + r, ch, fr * k, fg * k, fb * k);
    }
    const plot = (x, y, ch, col) => {
      const dx = AC.util.wrapDelta(x - p.x, S) / sxs + w / 2, dy = h / 2 - AC.util.wrapDelta(y - p.y, S) / sys;
      const c = Math.round(dx), r = Math.round(dy);
      if (c < 1 || c >= w - 1 || r < 1 || r >= h - 1) return;
      const a = AC.ACCENT[col];
      Scr.text(c0 + c, r0 + r, ch, a[0] * 255, a[1] * 255, a[2] * 255);
    };
    for (const c of cars) plot(c.x, c.y, 'o', c.paint || 3);
    for (const q of peds) if (q.visible) plot(q.x, q.y, '*', 1);
    const arrows = ['>', '/', '^', '\\', '<', '/', 'v', '\\'];
    const a = Math.round(((p.yaw % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI) / (Math.PI / 4)) % 8;
    const ar = arrows[a];
    Scr.text(c0 + Math.round(w / 2), r0 + Math.round(h / 2), ar === '/' && (a === 5) ? '/' : ar, 255, 255, 255);
  }

  function help(st, fr, fg, fb) {
    const s = Scr.scr;
    const lines = [
      'WASD ........ move            MOUSE ....... look (click to lock)',
      'SHIFT ....... sprint          ARROWS ...... look (keyboard)',
      'E ........... interact / open doors / use machines',
      'ESC ......... release mouse   T / Y ....... time +1h / pause clock',
      'R ........... rain off/light/heavy   P ..... phosphor colour',
      'M ........... minimap         G ........... CRT glow',
      'F ........... phosphor trails  N .......... sound on/off',
      '- / = ....... character resolution (auto-adjusts to hold 60 FPS)',
      '',
      'Find the green-lit doors: NEON NOODLE and PIXEL PALACE are open.',
    ];
    const w = Math.min(s.cols - 4, 72), h = lines.length + 4;
    const c0 = (s.cols - w) >> 1, r0 = Math.max(2, (s.rows - h) >> 1);
    box(c0, r0, w, h, fr, fg, fb, 'HELP');
    lines.forEach((l, k) => Scr.text(c0 + 3, r0 + 2 + k, l.slice(0, w - 5), fr * 0.9, fg * 0.9, fb * 0.9));
  }

  const BOOT = [
    'NEON//GRID TERMINAL BIOS v1.0  (C) 2089 KIROSHI-SONY',
    'MEMORY TEST ............................ 640K OK',
    'MOUNTING SECTOR KABUKI-7 ............... OK',
    'RAYCAST CORE [2.5D DDA] ................ ONLINE',
    'GLYPH ATLAS ............................ ' + AC.Glyphs.count + ' CHARS',
    'PHOSPHOR ............................... WARM',
    'TRAFFIC / PEDESTRIAN AI ................ RUNNING',
    '',
    '>> LINK ESTABLISHED',
  ];
  function boot(st, fr, fg, fb) {
    const s = Scr.scr;
    const n = Math.min(BOOT.length, Math.floor(st.boot * 3.2));
    const w = Math.min(s.cols - 4, 64), h = BOOT.length + 4;
    const c0 = (s.cols - w) >> 1, r0 = Math.max(2, (s.rows - h) >> 1);
    const fade = st.boot > 2.8 ? 1 - (st.boot - 2.8) / 0.4 : 1;
    box(c0, r0, w, h, fr * fade, fg * fade, fb * fade, 'BOOT');
    for (let k = 0; k < n; k++) Scr.text(c0 + 3, r0 + 2 + k, BOOT[k].slice(0, w - 5), fr * fade, fg * fade, fb * fade);
    if (n < BOOT.length && (st.boot * 8 | 0) & 1) Scr.text(c0 + 3, r0 + 2 + n, '_', fr, fg, fb);
  }

  function overlay(st, fr, fg, fb) {
    const s = Scr.scr;
    const w = Math.min(s.cols - 4, 46), h = 7;
    const c0 = (s.cols - w) >> 1, r0 = ((s.rows - h) >> 1) - 5;
    box(c0, r0, w, h, fr, fg, fb, 'LINK IDLE');
    const blink = (st.time * 2 | 0) & 1;
    const t1 = blink ? '>> CLICK TO JACK IN <<' : '   CLICK TO JACK IN   ';
    Scr.text(c0 + ((w - t1.length) >> 1), r0 + 2, t1, fr, fg, fb);
    const t2 = 'WASD MOVE / MOUSE LOOK / E INTERACT';
    Scr.text(c0 + ((w - t2.length) >> 1), r0 + 4, t2.slice(0, w - 2), fr * 0.6, fg * 0.6, fb * 0.6);
  }

  return { draw, message, location };
})();

// ---- input.js --------------------------------------------------------------
// ============================================================================
// input.js — keyboard, mouse look (pointer lock, with drag-to-look fallback)
// ============================================================================
AC.Input = (function () {
  'use strict';
  const keys = new Set();
  const pressed = [];
  let mdx = 0, mdy = 0, locked = false, dragging = false, el = null;
  const GAME_KEYS = new Set(['KeyW', 'KeyA', 'KeyS', 'KeyD', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'ShiftLeft', 'ShiftRight']);

  function init(element) {
    el = element;
    window.addEventListener('keydown', (e) => {
      if (e.repeat) { if (GAME_KEYS.has(e.code)) e.preventDefault(); return; }
      keys.add(e.code);
      pressed.push(e.code);
      if (GAME_KEYS.has(e.code)) e.preventDefault();
    });
    window.addEventListener('keyup', (e) => keys.delete(e.code));
    window.addEventListener('blur', () => keys.clear());
    el.addEventListener('mousedown', (e) => {
      if (!locked && el.requestPointerLock) {
        try { const p = el.requestPointerLock(); if (p && p.catch) p.catch(() => {}); } catch (err) { /* ignore */ }
      }
      dragging = true;
      pressed.push('Click');
      e.preventDefault();
    });
    window.addEventListener('mouseup', () => { dragging = false; });
    window.addEventListener('mousemove', (e) => {
      if (locked || dragging) { mdx += e.movementX || 0; mdy += e.movementY || 0; }
    });
    document.addEventListener('pointerlockchange', () => { locked = document.pointerLockElement === el; if (!locked) keys.clear(); });
  }

  return {
    init,
    key: (code) => keys.has(code),
    get locked() { return locked; },
    get mdx() { return mdx; },
    get mdy() { return mdy; },
    // call once per frame after the player consumed the deltas
    endFrame() { mdx = 0; mdy = 0; pressed.length = 0; },
    pressed: () => pressed,
    release() { if (document.exitPointerLock) document.exitPointerLock(); },
  };
})();

// ---- audio.js --------------------------------------------------------------
// ============================================================================
// audio.js — tiny procedural soundscape (WebAudio, no samples)
// ----------------------------------------------------------------------------
// Rain hiss (filtered noise), a low city drone, footsteps and UI blips. Starts
// on the first click (browser autoplay rules) and can be muted with N.
// ============================================================================
AC.Audio = (function () {
  'use strict';
  let ctx = null, master = null, rainGain = null, droneGain = null, noiseBuf = null, on = true;

  function start() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC_ = window.AudioContext || window.webkitAudioContext;
    if (!AC_) return;
    ctx = new AC_();
    master = ctx.createGain(); master.gain.value = on ? 0.5 : 0; master.connect(ctx.destination);
    // noise buffer
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    let s = 12345;
    for (let i = 0; i < d.length; i++) { s = (s * 1103515245 + 12345) & 0x7fffffff; d[i] = (s / 0x7fffffff) * 2 - 1; }
    // rain
    const rn = ctx.createBufferSource(); rn.buffer = noiseBuf; rn.loop = true;
    const bp = ctx.createBiquadFilter(); bp.type = 'highpass'; bp.frequency.value = 900;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 6000;
    rainGain = ctx.createGain(); rainGain.gain.value = 0.0;
    rn.connect(bp); bp.connect(lp); lp.connect(rainGain); rainGain.connect(master); rn.start();
    // drone
    droneGain = ctx.createGain(); droneGain.gain.value = 0.05;
    const dl = ctx.createBiquadFilter(); dl.type = 'lowpass'; dl.frequency.value = 160;
    for (const f of [41.2, 41.7, 61.8]) {
      const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.connect(dl); o.start();
    }
    dl.connect(droneGain); droneGain.connect(master);
  }

  function setRain(level) { if (rainGain) rainGain.gain.setTargetAtTime(0.09 * level, ctx.currentTime, 0.5); }

  function step(speed) {
    if (!ctx || !on) return;
    const t = ctx.currentTime;
    const src = ctx.createBufferSource(); src.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 500 + speed * 60;
    const g = ctx.createGain(); g.gain.setValueAtTime(0.0, t); g.gain.linearRampToValueAtTime(0.18, t + 0.005); g.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t, Math.random() * 1.5, 0.1);
  }

  function blip(freq, dur) {
    if (!ctx || !on) return;
    const t = ctx.currentTime;
    const o = ctx.createOscillator(); o.type = 'square'; o.frequency.value = freq || 880;
    const g = ctx.createGain(); g.gain.setValueAtTime(0.06, t); g.gain.exponentialRampToValueAtTime(0.001, t + (dur || 0.12));
    o.connect(g); g.connect(master); o.start(t); o.stop(t + (dur || 0.12) + 0.02);
  }

  function toggle() { on = !on; if (master) master.gain.value = on ? 0.5 : 0; return on; }

  return { start, setRain, step, blip, toggle, get on() { return on; } };
})();

// ---- main.js ---------------------------------------------------------------
// ============================================================================
// main.js — boot, game loop, input actions, adaptive resolution
// ----------------------------------------------------------------------------
// Frame outline:
//   input -> player (variable dt) -> AI/traffic (fixed 120 Hz steps)
//   -> environment + sign/light animation -> emit dynamic entities
//   -> raycast + shade every character -> geometry edges -> particles
//   -> phosphor persistence -> HUD -> blit
// ============================================================================
AC.Main = (function () {
  'use strict';
  const { wrapDelta, RNG } = AC.util;
  const SEED = 2089;
  const FIXED = 1 / 120;

  let W, env, ents, player, canvas, glowEl, wrapEl;
  let last = 0, acc = 0, simTime = 0, frameNo = 0, time = 0, bootT = 0;
  const stats = { fps: 60, rayMs: 0, postMs: 0, blitMs: 0, workMs: 0, rays: 0, steps: 0, drawn: 0 };
  const opts = { mapOn: true, helpOn: false, charH: 18, minCharH: 14, autoRes: true, maxT: 105, forceLocked: false };
  let resTimer = 0, workAcc = 0, workN = 0, rainLevel = 1, actRng = new RNG(99);
  let glitch = { t: 0, row: 0, n: 0, k: 0 };
  const RAIN_LEVELS = [0, 0.45, 1];

  function boot() {
    canvas = document.getElementById('screen');
    glowEl = document.getElementById('glow');
    wrapEl = document.getElementById('wrap');
    W = AC.WorldGen.generate(SEED);
    env = AC.Environment.create();
    env.rain = RAIN_LEVELS[rainLevel];
    AC.Physics.init(W);
    AC.Raycaster.init(W);
    AC.Screen.init(canvas, glowEl);
    ents = new AC.Entities.System(W, SEED ^ 0x1234);
    player = new AC.Player(W, W.spawn);
    player.onStep = (sp) => AC.Audio.step(sp);
    AC.Particles.init(W, SEED ^ 0x777);
    AC.Input.init(canvas);
    // pick an initial character size from the window height (~60 rows at 1080p)
    opts.charH = Math.max(opts.minCharH, Math.min(24, Math.round(window.innerHeight / 60)));
    resize();
    window.addEventListener('resize', resize);
    AC.Shading.init(W, env, AC.Screen.scr);
    AC.HUD.message('WELCOME TO KABUKI-7. THE NOODLE BAR ACROSS THE STREET IS OPEN.', 7);
    exposeDebug();
    last = performance.now();
    requestAnimationFrame(loop);
  }

  function resize() {
    const CH = opts.charH, CW = Math.max(4, Math.round(CH * 0.56));
    const ww = window.innerWidth, wh = window.innerHeight;
    const cols = Math.max(40, Math.floor(ww / CW)), rows = Math.max(20, Math.floor(wh / CH));
    AC.Screen.configure(cols, rows, CW, CH);
    canvas.style.width = cols * CW + 'px'; canvas.style.height = rows * CH + 'px';
    wrapEl.style.width = cols * CW + 'px'; wrapEl.style.height = rows * CH + 'px';
  }

  // resolution changes are applied at the start of the next frame so the
  // freshly cleared canvas is immediately redrawn (no black flash)
  let pendingCharH = 0;
  function setCharH(h) {
    h = Math.max(10, Math.min(32, h));
    if (h === opts.charH) return;
    pendingCharH = h;
  }
  function applyPendingResize() {
    if (!pendingCharH) return;
    opts.charH = pendingCharH; pendingCharH = 0;
    resize();
  }

  // ------------------------------------------------------------ interaction
  const DRINKS = ['SYNTH-COLA', 'NEURO-FIZZ', 'KAIJU ENERGY', 'GREEN TEA (REAL?)', 'VOLT MILK', 'RAMUNE 2089'];
  const KIOSK = ['CITY INFO: CURFEW LIFTED IN SECTOR 7', 'WEATHER: ACID RAIN 80% // pH 4.1', 'LOST PET: CYBER-CAT "BYTE". REWARD.', 'METRO LINE 3 DELAYED: POWER GRID FAULT', 'HIRING: NIGHT SHIFT DATA JANITORS'];

  function findInteractable() {
    let best = null, bd = 2.3;
    for (const it of W.interactables) {
      const dx = wrapDelta(it.x - player.x, W.S), dy = wrapDelta(it.y - player.y, W.S);
      const d = Math.hypot(dx, dy);
      if (d > bd) continue;
      let a = Math.atan2(dy, dx) - player.yaw;
      a = Math.atan2(Math.sin(a), Math.cos(a));
      if (Math.abs(a) > 0.95 && d > 0.8) continue;
      best = it; bd = d;
    }
    return best;
  }
  function promptFor(it) {
    if (!it) return null;
    if (it.type === 'door') {
      const d = it.door, b = W.buildings[d.bld];
      if (d.locked) return 'DOOR - ' + (b ? b.name : '') + ' [LOCKED]';
      return (d.playerOpen ? 'CLOSE DOOR' : 'ENTER ' + (b && b.displayName ? b.displayName : 'BUILDING'));
    }
    if (it.type === 'vending') return 'BUY A DRINK';
    if (it.type === 'arcade') return 'PLAY';
    if (it.type === 'kiosk') return 'READ TERMINAL';
    return 'USE';
  }
  function interact(it) {
    if (!it) { AC.HUD.message('NOTHING TO INTERACT WITH', 1.5); return; }
    if (it.type === 'door') {
      const d = it.door, b = W.buildings[d.bld];
      if (d.locked) {
        AC.HUD.message('ACCESS DENIED // KEYCARD REQUIRED', 2.5, 4);
        AC.Audio.blip(160, 0.25);
        return;
      }
      d.playerOpen = !d.playerOpen;
      d.target = d.playerOpen ? 1 : 0;
      d.away = 0;
      AC.HUD.message(d.playerOpen ? 'ACCESS GRANTED // ' + (b.displayName || b.name) : 'DOOR CLOSED', 2.5, d.playerOpen ? 5 : 0);
      AC.Audio.blip(d.playerOpen ? 1320 : 660, 0.1);
    } else if (it.type === 'vending') {
      AC.HUD.message('DISPENSED: ' + actRng.pick(DRINKS) + ' // ' + (80 + actRng.int(0, 12) * 10) + ' CR', 2.5, 2);
      AC.Audio.blip(990, 0.08);
    } else if (it.type === 'arcade') {
      AC.HUD.message('INSERT COIN ... HI-SCORE ' + String(actRng.int(10000, 99999)) + ' BY "ZER0"', 2.5, 1);
      AC.Audio.blip(1760, 0.06);
    } else if (it.type === 'kiosk') {
      AC.HUD.message(actRng.pick(KIOSK), 3.5, 2);
      AC.Audio.blip(1200, 0.05);
    }
  }

  function handleKeys() {
    for (const k of AC.Input.pressed()) {
      switch (k) {
        case 'Click': AC.Audio.start(); AC.Audio.setRain(env.rain); break;
        case 'KeyE': interact(findInteractable()); break;
        case 'KeyT': env.hour = (env.hour + 1) % 24; AC.HUD.message('CLOCK ' + AC.Environment.timeString(env), 1.5); break;
        case 'KeyY': env.paused = !env.paused; AC.HUD.message(env.paused ? 'CLOCK PAUSED' : 'CLOCK RUNNING', 1.5); break;
        case 'KeyR':
          rainLevel = (rainLevel + 1) % 3; env.rain = RAIN_LEVELS[rainLevel]; AC.Audio.setRain(env.rain);
          AC.HUD.message(['RAIN OFF', 'LIGHT RAIN', 'HEAVY RAIN'][rainLevel], 1.5); break;
        case 'KeyP': AC.HUD.message('PHOSPHOR: ' + AC.Environment.setPalette(env, env.palette + 1), 1.5); break;
        case 'KeyM': opts.mapOn = !opts.mapOn; break;
        case 'KeyH': opts.helpOn = !opts.helpOn; break;
        case 'KeyG': AC.Screen.scr.glowOn = !AC.Screen.scr.glowOn; glowEl.style.display = AC.Screen.scr.glowOn ? '' : 'none'; AC.HUD.message('GLOW ' + (AC.Screen.scr.glowOn ? 'ON' : 'OFF'), 1.2); break;
        case 'KeyF': AC.Screen.scr.persist = !AC.Screen.scr.persist; AC.HUD.message('PHOSPHOR TRAILS ' + (AC.Screen.scr.persist ? 'ON' : 'OFF'), 1.2); break;
        case 'KeyN': AC.HUD.message('SOUND ' + (AC.Audio.toggle() ? 'ON' : 'OFF'), 1.2); break;
        case 'KeyV': env.debugView = !env.debugView; break;
        case 'KeyB': AC.Screen.scr.edgeOn = !AC.Screen.scr.edgeOn; AC.HUD.message('EDGE PASS ' + (AC.Screen.scr.edgeOn ? 'ON' : 'OFF'), 1.2); break;
        case 'Minus': opts.autoRes = false; setCharH(opts.charH + 2); AC.HUD.message('RES ' + AC.Screen.scr.cols + 'x' + AC.Screen.scr.rows + ' (AUTO OFF)', 1.5); break;
        case 'Equal': opts.autoRes = false; setCharH(opts.charH - 2); AC.HUD.message('RES ' + AC.Screen.scr.cols + 'x' + AC.Screen.scr.rows + ' (AUTO OFF)', 1.5); break;
      }
    }
  }

  // --------------------------------------------------------- adaptive res
  function adaptResolution(dt, work) {
    if (!opts.autoRes || bootT < 2) return;
    workAcc += work; workN++;
    resTimer += dt;
    if (resTimer < 1.5) return;
    const avg = workAcc / workN;
    resTimer = 0; workAcc = 0; workN = 0;
    if (avg > 13.5 || stats.fps < 50) setCharH(opts.charH + 2);
    else if (avg < 6.5 && stats.fps > 57 && opts.charH > opts.minCharH) setCharH(opts.charH - 2);
  }

  // -------------------------------------------------------------- the loop
  function loop(now) {
    requestAnimationFrame(loop);
    let dt = (now - last) / 1000; last = now;
    if (!(dt > 0)) dt = 1 / 60;
    if (dt > 0.1) dt = 0.1;
    frame(dt);
  }

  function frame(dt) {
    time += dt; bootT += dt;
    applyPendingResize();
    const t0 = performance.now();
    handleKeys();
    player.update(dt, AC.Input, ents.colliders);
    AC.Input.endFrame();

    acc += dt;
    let n = 0;
    while (acc >= FIXED && n < 14) { AC.AI.step(ents, env, player, FIXED, simTime); simTime += FIXED; acc -= FIXED; n++; }
    if (n >= 14) acc = 0;
    AC.Environment.update(env, dt, simTime, frameNo);
    AC.AI.animate(W, env, simTime);

    const cam = player.camera();
    ents.emit(simTime, env, cam);
    AC.Particles.update(dt, cam, env, simTime);

    const scr = AC.Screen.scr;
    AC.Shading.beginFrame(simTime, frameNo, cam, opts.maxT);
    const t1 = performance.now();
    AC.Raycaster.castFrame(cam, scr, 1, scr.rows - 1, opts.maxT, AC.Shading.shade);
    const t2 = performance.now();
    if (scr.edgeOn) AC.Screen.edges(1, scr.rows - 1, 34, 0.2);
    AC.Particles.render(scr, cam, env, frameNo);
    AC.Screen.compose(dt);
    glitchPass(dt);
    const it = findInteractable();
    AC.HUD.draw({
      W, env, player, ents, fps: stats.fps, stats, prompt: promptFor(it), locked: AC.Input.locked || opts.forceLocked,
      mapOn: opts.mapOn, helpOn: opts.helpOn, boot: bootT, time,
    }, dt);
    const t3 = performance.now();
    stats.drawn = AC.Screen.present();
    const t4 = performance.now();

    const k = 0.08;
    stats.rayMs += (t2 - t1 - stats.rayMs) * k;
    stats.postMs += (t3 - t2 - stats.postMs) * k;
    stats.blitMs += (t4 - t3 - stats.blitMs) * k;
    stats.workMs += (t4 - t0 - stats.workMs) * k;
    stats.fps += (1 / dt - stats.fps) * 0.05;
    stats.rays = AC.Raycaster.stats.rays; stats.steps = AC.Raycaster.stats.steps;
    adaptResolution(dt, t4 - t0);
    frameNo++;
  }

  // occasional horizontal tearing of a few rows, like a bad VGA cable
  function glitchPass(dt) {
    const scr = AC.Screen.scr;
    if (glitch.t > 0) {
      glitch.t -= dt;
      const cols = scr.cols;
      for (let r = glitch.row; r < glitch.row + glitch.n && r < scr.rows - 1; r++) {
        const base = r * cols;
        for (const arr of [scr.dGlyph, scr.dR, scr.dG, scr.dB]) {
          const tmp = arr.slice(base, base + cols);
          for (let c = 0; c < cols; c++) arr[base + c] = tmp[(c - glitch.k + cols) % cols];
        }
      }
    } else if (AC.util.hash1(frameNo * 31 + 7) < 0.004) {
      glitch.t = 0.05 + AC.util.hash1(frameNo) * 0.1;
      glitch.row = 1 + Math.floor(AC.util.hash1(frameNo + 1) * (scr.rows - 4));
      glitch.n = 1 + Math.floor(AC.util.hash1(frameNo + 2) * 3);
      glitch.k = 1 + Math.floor(AC.util.hash1(frameNo + 3) * 4);
    }
  }

  // ---------------------------------------------------------------- debug
  function exposeDebug() {
    window.__AC = {
      W, env, ents, player, stats, opts,
      setPose(x, y, yaw, pitch) { player.x = x; player.y = y; player.yaw = yaw; player.pitch = pitch || 0; player.zFeet = AC.Physics.groundAt(x, y); player.vx = player.vy = 0; },
      setHour(h) { env.hour = h; },
      setRain(r) { env.rain = r; },
      setCharH(h) { opts.autoRes = false; setCharH(h); applyPendingResize(); },
      advance(sec) { const n = Math.round(sec / FIXED); for (let i = 0; i < n; i++) { AC.AI.step(ents, env, player, FIXED, simTime); simTime += FIXED; } },
      frame(dt) { frame(dt || 1 / 60); },
      text() {
        const s = AC.Screen.scr, L = AC.Glyphs.list;
        let out = '';
        for (let r = 0; r < s.rows; r++) { let line = ''; for (let c = 0; c < s.cols; c++) line += L[s.dGlyph[r * s.cols + c]]; out += line + '\n'; }
        return out;
      },
      interact() { interact(findInteractable()); },
      scr: AC.Screen.scr,
      set(path, v) { const ks = path.split('.'); let o = window.__AC; for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]]; o[ks[ks.length - 1]] = v; },
      prompt() { return promptFor(findInteractable()); },
    };
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
  return { stats, opts };
})();

</script>
</body>
</html>
